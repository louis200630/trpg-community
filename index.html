  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    // 修正：依據您的 JWT 提取之真實專案 ID (kpinvucugxsxjeyopezn) 自動拼接正確 URL
    const SUPABASE_URL = 'https://kpinvucugxsxjeyopezn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtwaW52dWN1Z3hzeGpleW9wZXpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3Njg0MDUsImV4cCI6MjEwNDM0NDQwNX0.nhwwJILYpXfAzBVuMZNCiwqUT1OwdtfjHPZGuwd82Uw';
    
    // 初始化 Supabase 實例（防止離線時崩潰）
    let supabase = null;
    try {

    const INITIAL_EVENTS = [
      {

          { userId: 'u-01', charName: '艾琳·范德堡', occupation: '私家女偵探', san: 55, phone: '0911-222-333', lineId: 'irene_v' },
          { userId: 'u-02', charName: '湯瑪斯·卡特', occupation: '戰地軍醫', san: 72, phone: '0922-333-444', lineId: 'doc_carter' }
        ]
      },
      {
        id: 'evt-102',
        title: '暗夜呢喃：黑水沼澤的洗禮',
        scenario_name: '印斯茅斯外傳篇章',
        one_liner: '麻薩諸塞州外緣荒涼鹽沼多起旅人失蹤，泥濘深處隱約傳來沉悶的心跳聲。',
        location: '新北市板橋地窖俱樂部 (實體面團)',
        event_date: '2026-09-18T14:00:00',
        max_players: 4,
        min_players: 3,
        lock_hours: 36,
        status: 'open',
        keeper_name: 'Keeper 奈亞',
        keeper_contact: 'LINE: @nyar_coc',
        booked_investigators: [
          { userId: 'u-02', charName: '湯瑪斯·卡特', occupation: '戰地軍醫', san: 72, phone: '0922-333-444', lineId: 'doc_carter' }
        ]
      },
      {
        id: 'evt-103',
        title: '皮克曼的模特兒：地下畫廊之夜',

        one_liner: '天才畫家的畫作栩栩如生且極度駭人，直到他在暗門後銷聲匿跡。',
        location: '線上 Discord 語音 + Roll20 沉浸地圖',
        event_date: '2026-09-25T20:00:00',
        max_players: 3,
        min_players: 2,

        status: 'open',
        keeper_name: 'Keeper 奈亞',
        keeper_contact: 'LINE: @nyar_coc',
        booked_investigators: []
      }
    ];

    const INITIAL_RECAPS = [
      {
        id: 'rec-1',
        title: '沉落的印斯茅斯燈塔之役',
        date: '2026-08-28',
        tag: '經典逃脫',
        summary: '軍醫精準投擲燃燒瓶封鎖旋轉階梯，調查員全員成功搭乘救生艇衝破潮汐逃脫。',
        survivors: ['湯瑪斯 (軍醫)', '奧古斯特 (教授)'],
        exp: 120,
        image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'rec-2',
        title: '阿卡姆古林地的深淵低語',
        date: '2026-08-14',
        tag: '狂亂震撼',
        summary: '四人誤闖古林石陣，在黎明破曉前夕驅車衝出封鎖，但一人意識陷入永久創傷。',
        survivors: ['艾琳 (偵探)', '諾曼 (記者)'],
        exp: 100,
        image: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=800&q=80'
      }
    ];

    const INITIAL_MY_CHARACTERS = [
      {
        id: 'char-1',
        name: '奧古斯特·德雷斯',
        occupation: '密大古典學教授',
        san: 65,
        maxSan: 99,
        feature: '隨身攜帶古代羊皮卷殘本，對古符號極具狂熱',
        isActive: true
      },
      {
        id: 'char-2',
        name: '「渡鴉」伊蓮娜',
        occupation: '黑市古董掮客',
        san: 35,
        maxSan: 85,
        feature: '聽覺敏銳，常在夜雨下水道聽見細微抓撓聲',
        isActive: false
      }
    ];

    function App() {
      // 導航狀態: 'lobby' (大廳) | 'archive' (花絮) | 'portal' (會員)
      const [currentTab, setCurrentTab] = useState('lobby');

      // 使用者狀態與權限
      const [currentUser, setCurrentUser] = useState(null);
      const [userRole, setUserRole] = useState('member'); // 'member' | 'admin'
      const [userExp, setUserExp] = useState(380);

      // 資料集
      const [events, setEvents] = useState(INITIAL_EVENTS);
      const [isLoadingEvents, setIsLoadingEvents] = useState(false);
      const [isUsingRemoteDb, setIsUsingRemoteDb] = useState(false);
      const [recaps, setRecaps] = useState(INITIAL_RECAPS);
      const [characters, setCharacters] = useState(INITIAL_MY_CHARACTERS);

      // 互動彈窗
      const [activeEvent, setActiveEvent] = useState(null);
      const [selectedCharId, setSelectedCharId] = useState(INITIAL_MY_CHARACTERS[0]?.id || '');
      const [lockAlertMessage, setLockAlertMessage] = useState(null);

      // 身分驗證彈窗狀態
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // 'login' | 'signup'
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authDisplayName, setAuthDisplayName] = useState('');

      // 新建活動彈窗 (Keeper 用，取代 prompt)
      const [showCreateEventModal, setShowCreateEventModal] = useState(false);
      const [newEventData, setNewEventData] = useState({
        title: '',
        scenario_name: '',
        one_liner: '',
        location: '',
        event_date: '2026-09-28T19:30:00',
        max_players: 4,
        min_players: 2
      });

      // 新增角色卡狀態
      const [showNewCharForm, setShowNewCharForm] = useState(false);
      const [newChar, setNewChar] = useState({ name: '', occupation: '', san: 60, feature: '' });

      // 自訂通知 Toast（取代原生 alert）
      const [toast, setToast] = useState({ message: '', type: 'info', visible: false });
      const triggerToast = (message, type = 'info') => {
        setToast({ message, type, visible: true });
        setTimeout(() => setToast(prev => ({ ...prev, visible: false })), 4000);
      };

      // 1. 監聽當前登入狀態
      useEffect(() => {
        if (!supabase) return;
        supabase.auth.getSession().then(({ data: { session } }) => {
          setCurrentUser(session?.user ?? null);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setCurrentUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      // 2. 抓取遠端場次，若資料庫為空或連線中則安全回退
      const fetchEvents = async () => {
        if (!supabase) return;
        try {
          setIsLoadingEvents(true);
          const { data, error } = await supabase
            .from('events')
            .select(`
              *,
              bookings (
                user_id,
                profiles ( display_name, phone, line_id ),
                characters ( name, occupation, san )
              )
            `)
            .order('event_date', { ascending: true });

          if (!error && data && data.length > 0) {
            const formatted = data.map(evt => ({
              ...evt,
              booked_investigators: (evt.bookings || []).map(b => ({
                userId: b.user_id,
                charName: b.characters?.name || '無名調查員',
                occupation: b.characters?.occupation || '神秘學者',
                san: b.characters?.san ?? 50,
                phone: b.profiles?.phone || '未填寫',
                lineId: b.profiles?.line_id || '未填寫'
              }))
            }));
            setEvents(formatted);
            setIsUsingRemoteDb(true);
          } else {
            // 資料庫尚未建立或尚無資料時，維持使用初始展示用資料
            setIsUsingRemoteDb(false);
          }
        } catch (err) {
          console.warn('遠端資料庫連線或讀取略過：', err.message);
        } finally {
          setIsLoadingEvents(false);
        }
      };

      useEffect(() => {
        fetchEvents();
      }, []);

      // 稱號等級計算
      const levelTitle = useMemo(() => {
        if (userExp >= 600) return '【傳奇】舊印持有者';
        if (userExp >= 300) return '【老練】阿卡姆秘社常客';
        return '【見習】初涉異變的調查員';
      }, [userExp]);

      // 判斷當前使用者是否已在該場名單中
      const isBooked = (event) => {
        const myId = currentUser ? currentUser.id : 'demo-user-id';
        return event.booked_investigators.some(i => i.userId === myId);
      };

      // 檢查是否處於 36 小時鎖定退團視窗內
      const checkIsLocked = (eventDateStr, lockHours = 36) => {
        const eventTime = new Date(eventDateStr).getTime();
        const now = new Date('2026-09-07T18:00:00').getTime();
        const diffHours = (eventTime - now) / (1000 * 60 * 60);
        return diffHours > 0 && diffHours <= lockHours;
      };

      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        if (!supabase) {
          triggerToast('Supabase 客戶端未就緒，目前為離線展示模式。', 'error');
          return;
        }

        if (authMode === 'login') {
          const { data, error } = await supabase.auth.signInWithPassword({
            email: authEmail,
            password: authPassword
          });
          if (error) {
            triggerToast('登入失敗：' + error.message, 'error');
          } else {
            triggerToast(`歡迎歸來，調查員：${data.user.email}`, 'success');
            setShowAuthModal(false);
            setAuthEmail('');
            setAuthPassword('');
          }
        } else {
          const { data, error } = await supabase.auth.signUp({
            email: authEmail,
            password: authPassword,
            options: {
              data: { full_name: authDisplayName || '無名調查員' }
            }
          });
          if (error) {
            triggerToast('註冊未完成：' + error.message, 'error');
          } else {
            triggerToast('註冊成功！若控制台未關閉驗證信，請前往信箱確認。', 'success');
            setShowAuthModal(false);
          }
        }
      };

      const handleLogout = async () => {
        if (supabase) {
          await supabase.auth.signOut();
        }
        setCurrentUser(null);
        triggerToast('已安全登出調查員系統。', 'info');
      };

      const handleJoinEvent = async (eventId) => {
        // 1. 若未登入，引導開啟登入視窗
        if (!currentUser) {
          triggerToast('【需要調查員身分】請先登入或註冊後再簽署調查契約！', 'error');
          setAuthMode('login');
          setShowAuthModal(true);
          return;
        }

        const char = characters.find(c => c.id === selectedCharId) || characters[0];
        if (!char) {
          triggerToast('請先在會員頁面登錄一張調查員角色卡！', 'error');
          return;
        }

        // 2. 若有遠端連線，嘗試寫入 Supabase (優先採用 RPC 防超賣)
        if (isUsingRemoteDb && supabase) {
          try {
            const { data, error } = await supabase.rpc('join_event_atomic', {
              p_event_id: eventId,
              p_character_id: char.id
            });

            if (error) {
              // 若 RPC 尚未建立，回退到一般 insert
              const { error: insertError } = await supabase
                .from('bookings')
                .insert({
                  event_id: eventId,
                  user_id: currentUser.id,
                  character_id: char.id,
                  status: 'confirmed'
                });
              if (insertError) throw insertError;
            }

            triggerToast('調查契約已成立！成功加入小隊。', 'success');
            fetchEvents();
            setActiveEvent(null);
            return;
          } catch (err) {
            triggerToast('報名失敗：' + err.message, 'error');
            return;
          }
        }

        // 3. 離線/展示環境下的本機狀態模擬
        setEvents(prev => prev.map(evt => {
          if (evt.id === eventId) {
            if (evt.booked_investigators.length >= evt.max_players) return evt;
            return {
              ...evt,
              booked_investigators: [
                ...evt.booked_investigators,
                {
                  userId: currentUser.id,
                  charName: char.name,
                  occupation: char.occupation,
                  san: char.san,
                  phone: '0988-777-666',
                  lineId: '@investigator_me'
                }
              ]
            };
          }
          return evt;
        }));

        triggerToast('契約立定！已加入調查小隊。', 'success');
        setActiveEvent(null);
      };

      const handleLeaveEvent = (evt) => {
        if (checkIsLocked(evt.event_date, evt.lock_hours)) {
          setLockAlertMessage(`開場前 ${evt.lock_hours} 小時已全面鎖定席位！為避免整團流會，退團請直接私訊聯絡 Keeper（${evt.keeper_contact}）。`);
          return;
        }

        const myId = currentUser ? currentUser.id : 'demo-user-id';

        setEvents(prev => prev.map(e => {
          if (e.id === evt.id) {
            return {
              ...e,
              booked_investigators: e.booked_investigators.filter(i => i.userId !== myId)
            };
          }
          return e;
        }));

        if (activeEvent && activeEvent.id === evt.id) {
          setActiveEvent(prev => ({
            ...prev,
            booked_investigators: prev.booked_investigators.filter(i => i.userId !== myId)
          }));
        }
        triggerToast('已自調查小隊名冊中註銷席位。', 'info');
      };

      const handleCreateChar = (e) => {
        e.preventDefault();
        if (!newChar.name || !newChar.occupation) return;
        const created = {
          id: `char-${Date.now()}`,
          name: newChar.name,
          occupation: newChar.occupation,
          san: Number(newChar.san) || 50,
          maxSan: 99,
          feature: newChar.feature || '隨身攜帶神祕符號懷錶',
          isActive: false
        };
        setCharacters(prev => [...prev, created]);
        setSelectedCharId(created.id);
        setShowNewCharForm(false);
        setNewChar({ name: '', occupation: '', san: 60, feature: '' });
        triggerToast(`角色卡「${created.name}」已登錄完成！`, 'success');
      };

      const handleCreateNewEvent = (e) => {
        e.preventDefault();
        if (!newEventData.title || !newEventData.location) return;
        const created = {
          id: `evt-${Date.now()}`,
          title: newEventData.title,
          scenario_name: newEventData.scenario_name || '原創調查模組',
          one_liner: newEventData.one_liner || '古老村落傳來異常低語，等待調查員前往探查。',
          location: newEventData.location,
          event_date: newEventData.event_date,
          max_players: Number(newEventData.max_players) || 4,
          min_players: Number(newEventData.min_players) || 2,
          lock_hours: 36,
          status: 'open',
          keeper_name: currentUser ? (currentUser.user_metadata?.full_name || 'Keeper') : 'Keeper 奈亞',
          keeper_contact: 'LINE: @miskatonic_keeper',
          booked_investigators: []
        };
        setEvents(prev => [created, ...prev]);
        setShowCreateEventModal(false);
        triggerToast('新團務場次已成功發布至跑團大廳！', 'success');
      };

      const handleAdminKick = (eventId, userId) => {
        setEvents(prev => prev.map(evt => {
          if (evt.id === eventId) {
            return {
              ...evt,
              booked_investigators: evt.booked_investigators.filter(i => i.userId !== userId)
            };
          }
          return evt;
        }));
        triggerToast('已將該名調查員移出隊伍。', 'info');
      };

      const handleAdminSettle = (eventId, exp = 100) => {
        setUserExp(prev => prev + exp);
        setEvents(prev => prev.map(e => e.id === eventId ? { ...e, status: 'completed' } : e));
        triggerToast(`結算完成！已向小隊發放 +${exp} EXP。`, 'success');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between text-parchment font-sans">
          
          {/* 自訂沉浸式通知 Toast */}
          {toast.visible && (
            <div className="fixed top-6 right-6 z-50 animate-bounce">
              <div className={`px-5 py-3 rounded-2xl shadow-2xl border text-sm font-medium flex items-center gap-3 backdrop-blur-xl ${
                toast.type === 'error' ? 'bg-crimsonDark/90 border-crimson text-white' :
                toast.type === 'success' ? 'bg-emerald-950/90 border-emerald-500 text-emerald-200' :
                'bg-purple-950/90 border-mystic text-parchment'
              }`}>
                <span>{toast.type === 'error' ? '⚠️' : toast.type === 'success' ? '📜' : 'ℹ️'}</span>
                <span>{toast.message}</span>
              </div>
            </div>
          )}

          {/* 頂部極簡現代導航 */}
          <header className="sticky top-0 z-30 bg-void/85 backdrop-blur-xl border-b border-purple-900/30">
            <div className="max-w-6xl mx-auto px-5 py-4 flex items-center justify-between">
              
              {/* Logo */}
              <div 
                onClick={() => setCurrentTab('lobby')}

                                <p className="text-xs text-mutedText mt-1">
                                  📅 {new Date(e.event_date).toLocaleString('zh-TW')} | 📍 {e.location}
                                </p>
                              </div>
                              <button
                                onClick={() => { setActiveEvent(e); setLockAlertMessage(null); }}
                                className="px-4 py-2 bg-void hover:bg-cardHover border border-purple-800 text-sm font-medium text-parchment rounded-xl transition"
                              >
                                查看小隊名冊
                              </button>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {/* 視角 B: Keeper 管理員專區 */}
                {userRole === 'admin' && (
                  <div className="space-y-6">
                    <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-purple-900/40 pb-3">
                      <div>
                        <h3 className="text-xl font-bold text-parchment flex items-center gap-2">
                          <span className="text-crimson">⚡</span> Keeper 團務管理台
                        </h3>
                        <p className="text-xs text-mutedText mt-1">檢視報名者資料、剔除不適任玩家或一鍵發放結算 EXP。</p>
                      </div>

                      <button
                        onClick={() => setShowCreateEventModal(true)}
                        className="px-4 py-2 bg-crimson hover:bg-crimsonDark text-white rounded-xl text-sm font-bold shadow-glow-purple transition"
                      >
                        + 發布新團務場次
                      </button>
                    </div>

                    {/* 場次與名冊管理 */}
                    <div className="space-y-6">
                      {events.map(evt => (
                        <div key={evt.id} className="bg-cardBg rounded-3xl p-6 border border-purple-900/40 space-y-4">
                          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 pb-3 border-b border-purple-950">
                            <div>
                              <h4 className="text-lg font-bold text-parchment">{evt.title}</h4>
                              <p className="text-xs text-mutedText mt-0.5">
                                時間：{new Date(evt.event_date).toLocaleString()} | 地點：{evt.location}
                              </p>
                            </div>
                            <div className="flex items-center gap-2">
                              {evt.status !== 'completed' && (
                                <button
                                  onClick={() => handleAdminSettle(evt.id, 120)}
                                  className="px-3.5 py-1.5 bg-emerald-950 hover:bg-emerald-900 border border-emerald-600 text-emerald-300 rounded-xl text-xs font-bold transition"
                                >
                                  ⚡ 一鍵結算 (+120 EXP)
                                </button>
                              )}
                              <button
                                onClick={() => {
                                  setEvents(prev => prev.filter(e => e.id !== evt.id));
                                  triggerToast('場次已關閉下架。', 'info');
                                }}
                                className="px-3 py-1.5 bg-stone-900 hover:bg-red-950 text-stone-400 hover:text-red-300 rounded-xl text-xs transition"
                              >
                                關閉場次
                              </button>
                            </div>
                          </div>

                          {/* 報名者聯絡清單 */}
                          <div className="space-y-2">
                            <span className="text-xs font-semibold text-copper block">
                              報名調查員清單 ({evt.booked_investigators.length} / {evt.max_players} 人)：
                            </span>

                            {evt.booked_investigators.length === 0 ? (
                              <div className="text-xs text-mutedText py-2 italic">尚無調查員加入。</div>
                            ) : (
                              <div className="divide-y divide-purple-950 border border-purple-950 rounded-2xl overflow-hidden bg-void/50">
                                {evt.booked_investigators.map(inv => (
                                  <div key={inv.userId} className="p-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-xs">
                                    <div>
                                      <span className="text-sm font-bold text-parchment">{inv.charName}</span>
                                      <span className="text-copper ml-2">({inv.occupation} • SAN: {inv.san})</span>
                                      <div className="text-mutedText mt-1 flex gap-3">
                                        <span>LINE: <strong className="text-emerald-400">{inv.lineId}</strong></span>
                                        <span>手機: <strong className="text-amber-400">{inv.phone}</strong></span>
                                      </div>
                                    </div>
                                    <button
                                      onClick={() => handleAdminKick(evt.id, inv.userId)}
                                      className="px-3 py-1 bg-red-950/60 hover:bg-red-900 text-red-300 rounded-lg text-xs transition border border-red-900/60"
                                    >
                                      踢出隊伍
                                    </button>
                                  </div>
                                ))}
                              </div>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            )}

          </main>

          {}
          {activeEvent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-cardBg border border-copper/50 rounded-3xl max-w-2xl w-full p-6 sm:p-8 space-y-6 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scrollbar">
                
                <div className="flex justify-between items-start border-b border-purple-950 pb-4">
                  <div>
                    <span className="text-xs font-semibold px-3 py-1 rounded-full bg-purple-950 text-purple-300 border border-purple-700/50">
                      {activeEvent.scenario_name}
                    </span>
                    <h3 className="text-2xl font-bold text-parchment mt-2">{activeEvent.title}</h3>
                  </div>
                  <button 
                    onClick={() => setActiveEvent(null)}
                    className="w-8 h-8 rounded-full bg-void flex items-center justify-center text-mutedText hover:text-white transition"
                  >
                    ✕
                  </button>
                </div>

                {/* 簡要資訊 */}
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm bg-void p-4 rounded-2xl border border-purple-950">
                  <div className="space-y-1.5">
                    <div className="text-mutedText">📅 開團時間：</div>
                    <div className="font-semibold text-parchment">
                      {new Date(activeEvent.event_date).toLocaleString('zh-TW', { dateStyle: 'medium', timeStyle: 'short' })}
                    </div>
                  </div>
                  <div className="space-y-1.5">
                    <div className="text-mutedText">📍 集合地點：</div>
                    <div className="font-semibold text-parchment">{activeEvent.location}</div>
                  </div>
                  <div className="sm:col-span-2 pt-2 border-t border-purple-950/60 text-mutedText text-xs leading-relaxed">
                    💡 簡介導讀：{activeEvent.one_liner}
                  </div>
                </div>

                {/* 小隊名冊 */}
                <div className="space-y-3">
                  <div className="flex justify-between items-center">
                    <h4 className="text-base font-bold text-copper flex items-center gap-2">
                      <span>👥</span> 調查小隊成員名冊 ({activeEvent.booked_investigators.length} / {activeEvent.max_players})
                    </h4>
                    <span className="text-xs text-mutedText">
                      {activeEvent.booked_investigators.length >= activeEvent.min_players ? '✓ 已達最低成團人數' : `尚需 ${activeEvent.min_players - activeEvent.booked_investigators.length} 人成團`}
                    </span>
                  </div>

                  {activeEvent.booked_investigators.length === 0 ? (
                    <div className="p-4 rounded-2xl bg-void/50 border border-dashed border-purple-950 text-center text-sm text-mutedText">
                      小隊目前尚無成員，成為第一位踏入迷霧的調查員吧！
                    </div>
                  ) : (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {activeEvent.booked_investigators.map((inv, idx) => (
                        <div key={idx} className="p-3.5 rounded-2xl bg-void border border-purple-900/60 flex items-center justify-between text-xs">
                          <div>
                            <span className="font-bold text-parchment text-sm block">{inv.charName}</span>
                            <span className="text-mutedText">{inv.occupation}</span>
                          </div>
                          <span className="text-emerald-400 font-mono font-bold bg-emerald-950/80 px-2 py-1 rounded-lg border border-emerald-800">
                            SAN: {inv.san}
                          </span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                {/* 退團鎖定提示 */}
                {lockAlertMessage && (
                  <div className="p-4 bg-red-950/60 border border-red-600 rounded-2xl text-xs text-red-200 leading-relaxed animate-pulse">
                    ⚠️ {lockAlertMessage}
                  </div>
                )}

                {/* 報名行動區 */}
                <div className="pt-4 border-t border-purple-950 space-y-4">
                  {isBooked(activeEvent) ? (
                    <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-emerald-950/30 p-4 rounded-2xl border border-emerald-900">
                      <span className="text-sm text-emerald-300 font-semibold">✓ 你已簽署契約並加入本場調查小隊</span>
                      <button
                        onClick={() => handleLeaveEvent(activeEvent)}
                        className="px-4 py-2 bg-red-950 hover:bg-red-900 text-red-300 border border-red-700 rounded-xl text-xs font-bold transition"
                      >
                        退出本次調查
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-3">
                      <div className="flex flex-col sm:flex-row sm:items-center gap-3">
                        <label className="text-sm text-copper font-medium whitespace-nowrap">指派調查員角色：</label>
                        <select
                          value={selectedCharId}
                          onChange={(e) => setSelectedCharId(e.target.value)}
                          className="w-full bg-void border border-purple-900 rounded-xl px-3 py-2.5 text-sm text-parchment focus:outline-none focus:border-copper"
                        >
                          {characters.map(c => (
                            <option key={c.id} value={c.id}>
                              {c.name} ({c.occupation}) - SAN: {c.san}
                            </option>
                          ))}
                        </select>
                      </div>

                      <div className="flex justify-end gap-3 pt-2">
                        <button
                          onClick={() => setActiveEvent(null)}
                          className="px-4 py-2.5 text-sm text-mutedText hover:text-white"
                        >
                          返回
                        </button>
                        <button
                          disabled={activeEvent.booked_investigators.length >= activeEvent.max_players}
                          onClick={() => handleJoinEvent(activeEvent.id)}
                          className={`px-6 py-2.5 rounded-xl text-sm font-bold transition shadow-glow-purple ${
                            activeEvent.booked_investigators.length >= activeEvent.max_players
                              ? 'bg-stone-900 text-stone-600 cursor-not-allowed'
                              : 'bg-copper hover:bg-copperDark text-black'
                          }`}
                        >
                          {activeEvent.booked_investigators.length >= activeEvent.max_players ? '席位已額滿' : '簽署契約・一鍵報名'}
                        </button>
                      </div>
                    </div>
                  )}
                </div>

              </div>
            </div>
          )}

          {}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-cardBg border border-purple-500/50 rounded-3xl max-w-md w-full p-6 sm:p-8 space-y-6 shadow-2xl relative">
                
                <div className="flex justify-between items-center border-b border-purple-950 pb-3">
                  <h3 className="text-xl font-bold font-gothic text-copper">
                    {authMode === 'login' ? '調查員身分驗證' : '新調查員登錄註冊'}
                  </h3>
                  <button 
                    onClick={() => setShowAuthModal(false)}
                    className="text-mutedText hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleAuthSubmit} className="space-y-4 text-sm">
                  {authMode === 'signup' && (
                    <div>
                      <label className="block text-xs text-mutedText mb-1">調查員代號 / 暱稱</label>
                      <input
                        required
                        type="text"
                        placeholder="例：阿卡姆神祕客"
                        value={authDisplayName}
                        onChange={e => setAuthDisplayName(e.target.value)}
                        className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment"
                      />
                    </div>
                  )}

                  <div>
                    <label className="block text-xs text-mutedText mb-1">聯絡信箱 (Email)</label>
                    <input
                      required
                      type="email"
                      placeholder="investigator@arkham.edu"
                      value={authEmail}
                      onChange={e => setAuthEmail(e.target.value)}
                      className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-mutedText mb-1">通關密碼</label>
                    <input
                      required
                      type="password"
                      placeholder="至少 6 位密碼"
                      value={authPassword}
                      onChange={e => setAuthPassword(e.target.value)}
                      className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full py-3 bg-gradient-to-r from-mystic to-purple-800 hover:from-purple-600 hover:to-mystic text-white font-bold rounded-xl transition shadow-glow-purple"
                  >
                    {authMode === 'login' ? '立即驗證登入' : '完成註冊簽名'}
                  </button>
                </form>

                <div className="pt-2 text-center text-xs text-mutedText">
                  {authMode === 'login' ? (
                    <span>初次造訪本社？ <button onClick={() => setAuthMode('signup')} className="text-copper hover:underline font-bold">註冊新帳號</button></span>
                  ) : (
                    <span>已有調查員身分？ <button onClick={() => setAuthMode('login')} className="text-copper hover:underline font-bold">返回登入</button></span>
                  )}
                </div>

              </div>
            </div>
          )}

          {}
          {showCreateEventModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-cardBg border border-crimson/50 rounded-3xl max-w-lg w-full p-6 sm:p-8 space-y-5 shadow-2xl relative max-h-[90vh] overflow-y-auto custom-scrollbar">
                
                <div className="flex justify-between items-center border-b border-purple-950 pb-3">
                  <h3 className="text-xl font-bold text-crimson flex items-center gap-2">
                    <span>⚡</span> 發布新團務場次
                  </h3>
                  <button onClick={() => setShowCreateEventModal(false)} className="text-mutedText hover:text-white">✕</button>
                </div>

                <form onSubmit={handleCreateNewEvent} className="space-y-4 text-sm">
                  <div>
                    <label className="block text-xs text-mutedText mb-1">場次標題 *</label>
                    <input
                      required
                      type="text"
                      placeholder="例：深入達維奇村的黑夜狂嘯"
                      value={newEventData.title}
                      onChange={e => setNewEventData({...newEventData, title: e.target.value})}
                      className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-mutedText mb-1">劇本名稱</label>
                      <input
                        type="text"
                        placeholder="例：原創經典改編"
                        value={newEventData.scenario_name}
                        onChange={e => setNewEventData({...newEventData, scenario_name: e.target.value})}
                        className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-mutedText mb-1">開團時間 *</label>
                      <input
                        required
                        type="datetime-local"
                        value={newEventData.event_date}
                        onChange={e => setNewEventData({...newEventData, event_date: e.target.value})}
                        className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment text-xs"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs text-mutedText mb-1">集合地點 *</label>
                    <input
                      required
                      type="text"
                      placeholder="例：台北市大安區秘密聚會所 (實體面團)"
                      value={newEventData.location}
                      onChange={e => setNewEventData({...newEventData, location: e.target.value})}
                      className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-mutedText mb-1">一句話神秘導讀</label>
                    <input
                      type="text"
                      placeholder="偏遠古村傳來山丘轟鳴，當地警長請求緊急支援..."
                      value={newEventData.one_liner}
                      onChange={e => setNewEventData({...newEventData, one_liner: e.target.value})}
                      className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-mutedText mb-1">成團人數 (Min)</label>
                      <input
                        type="number"
                        min="2"
                        max="6"
                        value={newEventData.min_players}
                        onChange={e => setNewEventData({...newEventData, min_players: e.target.value})}
                        className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment"
                      />
                    </div>
                    <div>
                      <label className="block text-xs text-mutedText mb-1">席位上限 (Max)</label>
                      <input
                        type="number"
                        min="2"
                        max="8"
                        value={newEventData.max_players}
                        onChange={e => setNewEventData({...newEventData, max_players: e.target.value})}
                        className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-parchment"
                      />
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-3">
                    <button
                      type="button"
                      onClick={() => setShowCreateEventModal(false)}
                      className="px-4 py-2 text-sm text-mutedText hover:text-white"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-crimson hover:bg-crimsonDark text-white font-bold rounded-xl text-sm transition"
                    >
                      確認發布場次
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {}
          <footer className="border-t border-purple-900/30 bg-void/90 py-6 text-center text-xs text-mutedText">
            <div className="max-w-6xl mx-auto px-5 flex flex-col sm:flex-row items-center justify-between gap-3">
              <span className="font-gothic tracking-wider text-parchment">
                MISKATONIC ARCHIVES • CALL OF CTHULHU 7TH ED.
              </span>
              <span>
                每週一團 • 沉浸式 TRPG 預約管理系統
              </span>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
