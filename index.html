    // 日期 / 時間工具
    const formatTimeLabel = (timeValue) => {
      if (!timeValue) {return '';}
      const [hourText,minuteText] = timeValue.split(':');
      const hour = Number(hourText);
      const period =
        hour < 12
          ? '上午'
          : '下午';
      const hour12 =
        hour % 12 === 0
          ? 12
          : hour % 12;
      return (
        `${period} ` +
        `${String(hour12).padStart(2, '0')}:` +
        `${minuteText}`
      );
    };

    const MAX_EVENT_YEAR = 2100;
    const getTodayLocalDate = () => {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };


    // 目前年份
    const getCurrentYear = () =>
      new Date().getFullYear();

    // 每 10 分鐘一個時段
    const TIME_OPTIONS = [];
    for (let hour = 0; hour < 24; hour++) {
      for (const minute of [0, 10, 20, 30, 40, 50]) {
        const value =
          `${String(hour).padStart(2, '0')}:` +
          `${String(minute).padStart(2, '0')}`;
        TIME_OPTIONS.push({ value, label: formatTimeLabel(value)});
      }
    }

    const isFourDigitDate = (value) => {
      if (!value) {return false;}
      const match =
        /^(\d{4})-(\d{2})-(\d{2})$/
          .exec(value);

      if (!match) {return false;}
      const year = Number(match[1]);
      const currentYear = getCurrentYear();
      return ( year >= currentYear && year <= MAX_EVENT_YEAR);
    };

    const hasValidYearLength = (value) => {
      if (!value) {return true;}
      const yearPart = value.split('-')[0];
      return (yearPart.length <= 4);
    };

    function App() {
      // --- 狀態管理 ---
      const [currentTab, setCurrentTab] = useState('lobby');
      const [currentUser, setCurrentUser] = useState(null);
      const [profile, setProfile] = useState(null);

      const [showArchivedCharacters, setShowArchivedCharacters] = useState(false);
      // Keeper 報名者詳細資料展開
      const [expandedParticipantKey, setExpandedParticipantKey] = useState(null);

      // 資料集
      const [events, setEvents] = useState([]);
      const [characters, setCharacters] = useState([]);
      const [isUsingMock, setIsUsingMock] = useState(false);
      const [settlingEvent, setSettlingEvent] = useState(null);
      const [growthNotes, setGrowthNotes] = useState({});
      const [growthRecords, setGrowthRecords] = useState([]);

      const [showProfileEdit, setShowProfileEdit] = useState(false);
      const [adminProfiles, setAdminProfiles] = useState({});
      const [profileForm, setProfileForm] =
        useState({
          display_name: '',

        });
      const [editingCharacter, setEditingCharacter] = useState(null);
      const [editCharacterData, setEditCharacterData] = useState({
          name: '',
          occupation: '',
          san: 60,
          max_san: 99,
          feature: ''
        });
      const [
        addingParticipantEvent,
        setAddingParticipantEvent
      ] = useState(null);
      const [
        memberSearch,
        setMemberSearch
      ] = useState('');
      const [
        memberSearchResults,
        setMemberSearchResults
      ] = useState([]);
      const [
        searchingMembers,
        setSearchingMembers
      ] = useState(false);

      // 互動視窗狀態
      const [activeEvent, setActiveEvent] = useState(null);
      const [selectedCharId, setSelectedCharId] = useState('');
      const [lockAlertMessage, setLockAlertMessage] = useState(null);

      // 花絮圖片牆
      const [galleryItems, setGalleryItems] = useState([]);
      const [galleryLoading, setGalleryLoading] = useState(false);

      const [showGalleryForm, setShowGalleryForm] = useState(false);
      const [editingGalleryItem, setEditingGalleryItem] = useState(null);

      const [galleryCaption, setGalleryCaption] = useState('');
      const [galleryFile, setGalleryFile] = useState(null);
      const [gallerySaving, setGallerySaving] = useState(false);

      // Lightbox
      const [galleryLightboxIndex, setGalleryLightboxIndex] = useState(null);

      // 表單狀態
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // login | signup
      const [authPasswordConfirm, setAuthPasswordConfirm] = useState('');
      const [awaitingEmailVerification, setAwaitingEmailVerification] = useState(false);
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authName, setAuthName] = useState('');

      const [authError, setAuthError] = useState('');
      const [authInfo, setAuthInfo] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      
      const [showNewEventModal, setShowNewEventModal] = useState(false);
      const [newEventData, setNewEventData] =
        useState({
          title: '',
          scenario_name: '',
          location: '',
          event_date: getTodayLocalDate(),
          event_time: '',
          one_liner: '',
          min: 1,
          max: 4
        });
      const newEventTimeRef = useRef(null);
      const newEventIntroRef = useRef(null);

      const [showNewCharForm, setShowNewCharForm] = useState(false);
      const [newChar, setNewChar] = useState({ name: '', occupation: '', san: 60, feature: '' });

      // Keeper 危險操作確認
      const [adminConfirmAction, setAdminConfirmAction] = useState(null);
      const [adminActionLoading, setAdminActionLoading] = useState(false);

      // 一般資料操作 Loading
      const [actionLoading,setActionLoading] = useState(null);
      const isActionLoading = (actionKey) => { return actionLoading === actionKey;};

      // 自訂通知 Toast（取代原生 alert）
      const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });
      const showToast = (msg, type = 'info') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3000);
      };

      useEffect(() => {
        if (!supabaseClient) {
          console.error('❌ supabaseClient 不存在');
          return;
        }

        console.log('🔎 Supabase Client:', supabaseClient);
        console.log('🔎 Supabase Auth:', supabaseClient.auth);

        if (!supabaseClient.auth) {
          console.error('❌ supabaseClient.auth 不存在');

        }

        // 取得目前登入狀態
        supabaseClient.auth
          .getSession()
          .then(({ data, error }) => {
            console.log('🔎 getSession:', data, error);

            if (error) {
              console.error('getSession error:', error);
              return;
            }

            setCurrentUser(data?.session?.user ?? null);
          });

        // 監聽登入 / 登出
        const {
          data: authListener
        } = supabaseClient.auth.onAuthStateChange(
          (event, session) => {
            console.log('🔐 Auth 狀態改變:',event,session);

            setCurrentUser(session?.user ?? null);

            // 使用者從重設密碼 Email 回來
            if (event === 'PASSWORD_RECOVERY') {

              setAuthMode('recovery');

              setAuthPassword('');
              setAuthPasswordConfirm('');

              setAuthError('');
              setAuthInfo('身分驗證成功，請設定新的登入密碼。');

              setShowAuthModal(true);
            }
          }
        );

        return () => {
          authListener?.subscription?.unsubscribe();
        };

      }, []);

      // 建立重設密碼 Redirect URL
      const getAuthRedirectUrl = () => {
        if (
          window.location.protocol !== 'http:' &&
          window.location.protocol !== 'https:'
        ) {
          return null;
        }
        return (
          window.location.origin +
          window.location.pathname
        );
      };

      const fetchProfile = async (user) => {
        if (!supabaseClient || !user) {
          setProfile(null);
          setAccountRole('member');
          setPortalView('member');
          return;
        }

        try {
          const { data, error } = await supabaseClient
            .from('profiles')
            .select(`
              id,
              email,
              display_name,
              phone,
              line_id,
              role
            `)
            .eq('id', user.id)
            .single();

          console.log('👤 Profile 查詢結果:', data);
          console.log('👤 Profile 查詢錯誤:', error);

          if (error) {
            throw error;

            data?.role === 'admin'

          setAccountRole('member');
          setPortalView('member');

      };

      // Keeper 聯絡資料
      const fetchAdminProfiles = async () => {
        if ( !currentUser || accountRole !== 'admin') {
          setAdminProfiles({});

        const { data, error } =

            .from('profiles')
            .select(`
              id,
              email,
              display_name,
              phone,
              line_id

        if (error) {
          console.error('讀取會員聯絡資料失敗:',error);
          return;
        }
        const profileMap =
          Object.fromEntries(
            (data || []).map(
              p => [p.id, p]

      const handleUpdateProfile = async (e) => {
        e.preventDefault();

        const actionKey = 'profile';

        if (!currentUser) { return showToast('請先登入。','error');}
        if (!profileForm.display_name.trim()) { return showToast('請輸入調查員暱稱。','error');}

        if (isActionLoading(actionKey)) {return;}
        setActionLoading(actionKey);

        try {
          const { data, error } =
            await supabaseClient.rpc(
              'update_my_profile',
              {
                p_display_name: profileForm.display_name.trim(),
                p_phone: profileForm.phone.trim() || null,
                p_line_id: profileForm.line_id.trim() || null

            );

          console.log('👤 更新會員資料:',data,error);

          if (error) {
            return showToast('更新失敗：' + error.message,'error');
          }

          await fetchProfile(currentUser);
          setShowProfileEdit(false);
          showToast('會員資料已更新。','success');

        } catch (err) {
          console.error('會員資料更新錯誤:',err);
          showToast('更新失敗：' + err.message, 'error');
        } finally {
          setActionLoading(null);
        }

      // Admin 身分確認後才抓

        if ( currentUser && accountRole === 'admin') {

        currentUser, accountRole

      useEffect(() => {

        fetchGallery();
        // 公開團務
        fetchEvents();
        if (currentUser) {
          console.log('👤 已登入，讀取會員資料:',currentUser.id);
          fetchProfile(currentUser);
          fetchCharacters();
          fetchGrowthRecords();
        } else {
          console.log('👤 未登入');
          setProfile(null);
          setAccountRole('member');
          setPortalView('member');

          setCharacters([]);
          setSelectedCharId('');
          setGrowthRecords([]);
        }
      }, [currentUser]);

      // 支援鍵盤 操作 Lightbox
      useEffect(() => {
        if (galleryLightboxIndex === null) {return;}
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') {closeGalleryLightbox();}
          if (e.key === 'ArrowLeft') {showPreviousGallery();}
          if (e.key === 'ArrowRight') {showNextGallery();}
        };
        window.addEventListener('keydown',handleKeyDown);
        return () => {window.removeEventListener('keydown',handleKeyDown);};
      }, [
        galleryLightboxIndex,
        galleryItems.length
      ]);

      // 讀取 Gallery
      const fetchGallery = async () => {
        if (!supabaseClient) {
          setGalleryItems([]);
          return;
        }
        setGalleryLoading(true);
        try {
          const {data,error} =
            await supabaseClient.rpc('get_public_gallery');
          console.log('🖼 公開花絮:',data,error);

          if (error) {throw error;}

          const formatted = (data || []).map(item => {
              const {data: publicUrlData} =
                supabaseClient.storage.from('trpg-gallery').getPublicUrl(item.image_path);

              return {
                id: item.id,
                imagePath: item.image_path,
                imageUrl: publicUrlData.publicUrl,
                caption: item.caption || '',
                createdAt: item.created_at
              };

          setGalleryItems(
            formatted
          );

          setGalleryLoading(false);

      // 讀取團務
      const fetchEvents = async () => {
        // Supabase 完全不可用時才進入展示模式
        if (!supabaseClient) { useMockEvents(); return false;}
        try {
          const {data: evts,error} =
            await supabaseClient.rpc('get_events_dashboard');

          if (error) {throw error;}
          console.log('🔐 安全團務資料:',evts);

          const formattedEvts = (evts || []).map( evt => ({...evt,
              booked_investigators:
                Array.isArray(evt.booked_investigators)
                  ? evt.booked_investigators
                  : [],
              my_booking: evt.my_booking || null,
              history_count: Number(evt.history_count || 0)
            })
          );

          setEvents(formattedEvts);
          setIsUsingMock(false);
          return true;

          console.error('❌ 團務資料讀取失敗:',err);
          return false;

        }
      };

        if (!currentUser) {
          setCharacters([]);
          setSelectedCharId('');
          return true;
        }

        if (!supabaseClient) {
          useMockCharacters();
          return false;
        }

        try {
          const {data,error} =
            await supabaseClient.from('characters').select('*').eq('user_id',currentUser.id);

          if (error) {throw error;}

          const chars = data || [];
          console.log('🎭 我的角色:',chars);

          setCharacters(chars);

          const playableChars = chars.filter( char => !char.is_archived);
          if ( playableChars.length > 0) {
            const activeChar = playableChars.find(char => char.is_active === true) || playableChars[0];
            setSelectedCharId(activeChar.id);
          } else {
            setSelectedCharId('');
          }
          return true;
        } catch (err) {
          console.error('❌ 角色資料讀取失敗:',err);
          return false;
        }
      };

      // 稱號設定
      const getCharacterTitle = (san) => {
        const value = Number(san) || 0;
        if (value >= 80) {return '【清醒】理智守望者';}
        if (value >= 60) {return '【堅定】秘聞調查員';}
        if (value >= 40) {return '【動搖】深淵凝視者';}
        if (value >= 20) {return '【危險】夢魘倖存者';}
        return '【狂亂】不可名狀之觸';
      };

      // 出戰角色
      const handleSetActiveCharacter = async (characterId) => {

        const actionKey =`active:${characterId}`;
        if (isActionLoading(actionKey)) {return;}

        if (!currentUser) { return showToast('請先登入。','error');}
        setActionLoading(actionKey);
        try {
          const { data, error } =
            await supabaseClient.rpc('set_active_character',{p_character_id: characterId});

        if (message.includes('invalid email') || message.includes('invalid format')) {return 'Email 格式不正確，請重新輸入。';}
        if (message.includes('rate limit') || message.includes('too many requests') || error?.status === 429) {return '操作次數過多，請稍後再試。';}

          ? `註冊失敗：${error?.message || '請稍後再試。'}`

        if (!password) { setAuthError('請輸入密碼。'); return;}

            if (error) {
              setAuthError( getAuthErrorMessage(error,'signup'));

            /*

            if ( data?.user && Array.isArray( data.user.identities) && data.user.identities.length === 0) {

              setShowAuthModal(false);

            // 需要 Email 驗證
            setAuthInfo('註冊資料已送出！請前往 Email 信箱完成驗證，再回來登入。');

            // 密碼不要留在畫面

            return;

          await fetchEvents();

          setActionLoading(null);

      const handleAdminKick = async (eventId, userId) => {

        const actionKey =`kick:${eventId}:${userId}`;
        if (isActionLoading(actionKey)) {return;}

        setActionLoading(actionKey);

        try {
          const { data, error } =
            await supabaseClient.rpc(
              'admin_remove_participant',
              {
                p_event_id: eventId,
                p_user_id: userId
              }
            );
          console.log('🚪 Keeper 移除玩家:',data,error);

          await fetchEvents();
          setExpandedParticipantKey(null);
          showToast('已將該名調查員移出隊伍，紀錄將保留。','success');

        } catch (err) {
          console.error('移除玩家錯誤:',err);
          showToast('移除失敗：' + err.message,'error');
        } finally {
          setActionLoading(null);
        }
      };

      // 玩家資訊展開
      const toggleParticipantDetails = (eventId,userId) => {
        const key = `${eventId}-${userId}`;
        setExpandedParticipantKey(current => current === key ? null : key);
      };

      // 事後KP加入玩家
      const handleOpenAddParticipant = (evt) => {
        if (accountRole !== 'admin') {
          return showToast('只有 Keeper 可以手動加入玩家。','error');
        }
        if (evt.status !== 'open') {
          return showToast('此團務目前不能新增玩家。','error');
        }
        setAddingParticipantEvent(evt);
        setMemberSearch('');
        setMemberSearchResults([]);
      };

      // 搜尋會員
      const handleSearchMembers = async () => {
        const keyword = memberSearch.trim();
        if (keyword.length < 2) {
          return showToast('請至少輸入 2 個字元。','error');
        }

        setSearchingMembers(true);

        try {
          const { data, error } = await supabaseClient.rpc('admin_search_members',{p_keyword: keyword});
          console.log('🔎 Keeper 搜尋會員:',data,error);
          if (error) {return showToast('搜尋失敗：' + error.message,'error');}

          setMemberSearchResults(data || []);

        } catch (err) {
          console.error('搜尋會員錯誤:',err);
          showToast('搜尋失敗：' + err.message,'error');
        } finally {
          setSearchingMembers(false);
        }
      };

      // Keeper 手動加入玩家
      const handleAdminAddParticipant = async (characterId) => {

        const actionKey = `add:${characterId}`;
        if (isActionLoading(actionKey)) {return;}

        if (
          !addingParticipantEvent ||
          !characterId
        ) {
          return;
        }

        setActionLoading(actionKey);

        try {
          const { data, error } =
            await supabaseClient.rpc(
              'admin_add_participant',
              {
                p_event_id: addingParticipantEvent.id,
                p_character_id: characterId
              }
            );
          console.log('➕ Keeper 加入玩家:',data,error);
          if (error) { return showToast('加入失敗：' + error.message,'error');
          }

          setAddingParticipantEvent(null);
          setMemberSearch('');
          setMemberSearchResults([]);
          await fetchEvents();
          showToast('已將角色加入本場團務。', 'success');

        } catch (err) {
          console.error('Keeper 加入玩家錯誤:',err);
          showToast('加入失敗：' + err.message,'error');
        } finally {
          setActionLoading(null);
        }
      };

      // 確認動作的彈窗
      const handleOpenAdminConfirm = (type,evt) => {
        if (accountRole !== 'admin') {
          return;
        }
        if (type === 'delete' && !canPermanentlyDeleteEvent(evt)) {
          if (evt.status === 'completed') {
            return showToast('已完成結算的團務不能永久刪除。','error');
          }
          return showToast('此團務已有玩家紀錄，請先取消團務。','error');
        }
        setAdminConfirmAction({type,event: evt});
      };
      const handleCloseAdminConfirm = () => {
        if (adminActionLoading) {return;}
        setAdminConfirmAction(null);
      };

      // 取消團務
      const handleAdminCancelEvent = async (evt) => {
        if (accountRole !== 'admin') {
          return showToast('只有 Keeper 可以取消團務。','error');
        }
        if (evt.status === 'completed') {
          return showToast('已完成結算的團務不能取消。','error');
        }

        setAdminActionLoading(true);

        try {
          const { data, error } = await supabaseClient.rpc('cancel_event', {p_event_id: evt.id});
          console.log('🚫 取消團務:',data,error);
          if (error) {return showToast('取消失敗：' + error.message,'error');}

          setAdminConfirmAction(null);

          await fetchEvents();
          showToast('團務已取消，歷史資料仍會保留。','success');
        } catch (err) {
          console.error('取消團務錯誤:',err);
          showToast('取消失敗：' + err.message,'error');
        } finally {
          setAdminActionLoading(false);
        }
      };

      const handleAdminDeleteEvent = async (evt) => {
        if (accountRole !== 'admin') {
          return showToast('只有 Keeper 可以刪除場次。','error');
        }
        if (!canPermanentlyDeleteEvent(evt)) {
          return showToast(
            evt.status === 'completed'
              ? '已完成結算的團務不能永久刪除。'
              : '此團務已有玩家紀錄，請先取消團務。',
            'error'
          );
        }

        setAdminActionLoading(true);

        try {
          const {data,error} = await supabaseClient.rpc('delete_event_permanently',{p_event_id: evt.id});
          console.log('🗑 永久刪除場次:', data, error);

          if (error) { return showToast('刪除失敗：' + error.message, 'error');}

          setExpandedParticipantKey(null);

          showToast('場次已永久刪除。','success');

          console.error('刪除場次錯誤:',err);
          showToast('刪除失敗：' + err.message,'error');
        } finally {
          setAdminActionLoading(false);
        }
      };

      const canPermanentlyDeleteEvent = (evt) => {
        if (!evt) {
          return false;
        }
        // 已完成團務永久保留
        if (evt.status === 'completed') {
          return false;
        }
        // 已取消團務可直接永久刪除
        if (evt.status === 'cancelled') {
          return true;
        }
        // 尚未取消的團務必須完全沒有任何 booking 歷史
        const historyCount = Number(evt.history_count || 0);
        return historyCount === 0;
      };

      // 編輯團務
      const [editingEvent, setEditingEvent] =  useState(null);

      const [editEventData, setEditEventData] =
        useState({
          title: '',
          scenario_name: '',
          location: '',
          event_date: '',
          event_time: '',
          one_liner: '',
          min: 1,
          max: 4
        });
      const editEventTimeRef = useRef(null);
      const editEventIntroRef = useRef(null);
      
      // 日期轉換工具
      const toLocalDateParts = (dateString) => {
        const date = new Date(dateString);
        const pad = value => String(value).padStart(2, '0');
        return {
          date:
            `${date.getFullYear()}-` +
            `${pad(date.getMonth() + 1)}-` +
            `${pad(date.getDate())}`,
          time:
            `${pad(date.getHours())}:` +
            `${pad(date.getMinutes())}`
        };
      };

      const handleOpenEditEvent = (evt) => {
        if ( isEventChangeLocked( evt.event_date,evt.lock_hours)) {
          return showToast(`本場已進入開團前 ${evt.lock_hours || 36} 小時鎖定期，無法修改。`,'error');
        }

        const dateParts = toLocalDateParts(evt.event_date);
        setEditingEvent(evt);
        setEditEventData({
          title: evt.title || '',
          scenario_name: evt.scenario_name || '',
          location: evt.location || '',
          event_date: dateParts.date,
          event_time: dateParts.time,
          one_liner: evt.one_liner || '',
          min: evt.min_players || 1,
          max: evt.max_players || 4
        });
      };

      const isEventChangeLocked = (
        eventDateStr,
        lockHours = 36
      ) => {
        const eventTime = new Date(eventDateStr).getTime();
        const lockTime = eventTime - Number(lockHours || 36) * 60 * 60 * 1000;
        return Date.now() >= lockTime;
      };

      // 儲存編輯
      const handleUpdateEvent = async (e) => {
        e.preventDefault();

        if (!editingEvent) return;
        
        const actionKey =`update-event:${editingEvent.id}`;
        if (isActionLoading(actionKey)) {return;}

        const minPlayers = Number(editEventData.min);
        const maxPlayers = Number(editEventData.max);


        if (
          !Number.isInteger(minPlayers) ||
          !Number.isInteger(maxPlayers) ||
          minPlayers < 1 ||
          maxPlayers < 1 ||
          minPlayers > maxPlayers ||
          maxPlayers > 8
        ) {
          return showToast('人數設定錯誤：最低至少 1 人、最高最多 8 人，且最低人數不可高於最高人數。','error');
        }

        if (!editEventData.title.trim()) {return showToast('請輸入場次標題。', 'error');}
        if (!editEventData.scenario_name.trim()) {return showToast('請輸入劇本名稱。', 'error');}
        if (!editEventData.location.trim()) {return showToast('請輸入集合地點。', 'error');}
        if (!editEventData.event_date) {return showToast('請選擇開團日期。','error');}
        if (!isFourDigitDate(editEventData.event_date)) {return showToast(`開團年份必須介於 ${getCurrentYear()} ～ ${MAX_EVENT_YEAR} 年。`,'error');}
        if (!editEventData.event_time) {return showToast('請選擇開團時間。','error');}

        const editedEventDateTime = new Date(
          `${editEventData.event_date}` +
          `T${editEventData.event_time}:00`
        );
        if (Number.isNaN(editedEventDateTime.getTime())) {return showToast('開團日期或時間格式不正確。','error');}

        const editLockHours = Number(editingEvent.lock_hours || 36);
        const minimumEditTime = Date.now() + editLockHours * 60 * 60 * 1000;
        if (editedEventDateTime.getTime() <= minimumEditTime) {return showToast(`修改後的開團時間必須距離現在超過 ${editLockHours} 小時。`,'error');}

        setActionLoading(actionKey);

        try {
          const { data, error } =
            await supabaseClient.rpc(
              'update_event',
              {
                p_event_id: editingEvent.id,
                p_title: editEventData.title.trim(),
                p_scenario_name: editEventData.scenario_name.trim(),
                p_location: editEventData.location.trim(),
                p_event_date: editedEventDateTime.toISOString(),
                p_one_liner: editEventData.one_liner.trim(),
                p_min_players: minPlayers,
                p_max_players: maxPlayers
              }
            );
          console.log('📝 修改團務:',data,error);

          if (error) {return showToast('修改失敗：' + error.message, 'error');}
          setEditingEvent(null);

          await fetchEvents();
          showToast('團務修改成功！','success');

        } catch (err) {
          console.error('修改團務錯誤:',err);
          showToast('修改失敗：' + err.message,'error');
        } finally {
          setActionLoading(null);
        }
      };

      // 團務結算
      const handleOpenSettlement = (evt) => {
        if (!evt.booked_investigators?.length) { return showToast('目前沒有參團角色，無法進行結算。','error');}
        if (evt.status !== 'open') {return showToast('此團務目前不能進行結算。','error');}
        if ( new Date(evt.event_date).getTime() > Date.now()) { return showToast( '團務尚未開始，無法結算。','error');}
        const initialNotes = {};
        evt.booked_investigators.forEach(inv => { initialNotes[inv.characterId] = '';});
        setGrowthNotes(initialNotes);
        setSettlingEvent(evt);
      };

      const handleSettleEvent = async (e) => {
        e.preventDefault();

        const actionKey = `settle:${settlingEvent?.id}`;
        if (isActionLoading(actionKey)) {return;}

        if (!settlingEvent) return;

        const growths =
          settlingEvent.booked_investigators.map(
            inv => ({
              character_id: inv.characterId,
              growth_note: (growthNotes[inv.characterId] || '').trim()
            })
          );

        if ( growths.some( item => !item.growth_note) ) { return showToast('請替每位參團角色填寫成長紀錄。','error');}

        setActionLoading(actionKey);

        try {
          const {data,error} =
            await supabaseClient.rpc(
              'settle_event',
              {
                p_event_id: settlingEvent.id,
                p_growths: growths
              }
            );

          if (error) {return showToast('結算失敗：' + error.message,'error');}

          setSettlingEvent(null);
          setGrowthNotes({});

          await Promise.all([
            fetchEvents(),
            fetchGrowthRecords()
          ]);

          showToast('團務結算完成，角色成長紀錄已發放。','success');

        } catch (err) {
          console.error('團務結算錯誤:',err);
          showToast('結算失敗：' + err.message,'error');
        } finally {
          setActionLoading(null);
        }
      };

      // 讀取成長紀錄
      const fetchGrowthRecords = async () => {
        if (!supabaseClient || !currentUser) {setGrowthRecords([]);return;}
        const { data, error } =
          await supabaseClient.from('character_growth_records')
            .select(`
              id, event_id, character_id, user_id, growth_note, created_at
            `)
            .eq('user_id', currentUser.id)
            .order('created_at', {ascending: false});

        console.log('📚 成長紀錄:',data,error);

        if (error) { console.error('讀取成長紀錄失敗:',error); return;}
        setGrowthRecords( data || []);
      };

      // 打開成長紀錄表
      const handleOpenEditCharacter = (character) => {
        setEditingCharacter(character);
        setEditCharacterData({
          name: character.name || '',
          occupation: character.occupation || '',
          san: character.san ?? 60,
          max_san: character.max_san ?? 99,
          feature: character.feature || ''
        });
      };

      // 儲存編輯角色卡
      const handleUpdateCharacter = async (e) => {
        e.preventDefault();
        if ( !currentUser || !editingCharacter) { return;}

        const actionKey = `update-char:${editingCharacter.id}`;
        if (isActionLoading(actionKey)) {return;}

        const san = Number(editCharacterData.san);
        const maxSan = Number(editCharacterData.max_san);

        if (
          !Number.isInteger(san) ||
          !Number.isInteger(maxSan) ||
          maxSan < 1 ||
          maxSan > 99 ||
          san < 0 ||
          san > maxSan
        ) {
          return showToast( '請確認 SAN 與最大 SAN 設定。','error');
        }

        if (!editCharacterData.name.trim()) {
          return showToast('請輸入角色姓名。','error');
        }
        if (!editCharacterData.occupation.trim()) {
          return showToast('請輸入角色職業。','error');
        }

        setActionLoading(actionKey);

        try {
          const payload = {
            name: editCharacterData.name.trim(),
            occupation: editCharacterData.occupation.trim(),
            san,max_san: maxSan,
            feature: editCharacterData.feature.trim()
          };

          const { error } = await supabaseClient.from('characters').update(payload).eq('id', editingCharacter.id).eq('user_id',currentUser.id);
          if (error) {throw error;}

          setEditingCharacter(null);
          await fetchCharacters();
          showToast('✏️ 角色已更新。','success');

        } catch (err) {
          console.error('角色更新失敗:',err);
            showToast('角色更新失敗：' + err.message, 'error');
          } finally {
            setActionLoading(null);
          }
      };

      // 可使用角色
      const availableCharacters = characters.filter( character => !character.is_archived);
      // 已封存角色
      const archivedCharacters = characters.filter( character => character.is_archived);

      // 取得使用者的報名紀錄
      const myEventRecords = currentUser ? events.filter( evt => getMyBookingRecord(evt)) : [];
      // Keeper 團務分類
      const sortEventsByDate = (items,direction = 'asc') => {
        return [...items].sort((a, b) => {
            const timeA = new Date(a.event_date).getTime();
            const timeB = new Date(b.event_date).getTime();
            return direction === 'desc'
              ? timeB - timeA
              : timeA - timeB;
          }
        );
      };

      // Member 目前預約
      const currentMemberEvents = myEventRecords.filter(evt => {
        const booking = getMyBookingRecord(evt);
        return (
          booking?.status === 'confirmed' &&
          evt.status !== 'completed' &&
          evt.status !== 'cancelled'
        );
      })
      .sort((a, b) =>
          new Date(a.event_date).getTime() -
          new Date(b.event_date).getTime()
      );

      // Member 歷史紀錄
      const historyMemberEvents = myEventRecords.filter(evt => {
        const booking = getMyBookingRecord(evt);
        return (
          booking?.status === 'withdrawn' ||
          booking?.status === 'removed' ||
          evt.status === 'completed' ||
          evt.status === 'cancelled'
        );
      })
      .sort((a, b) =>
          new Date(b.event_date).getTime() -
          new Date(a.event_date).getTime()
      );

      // 目前要顯示哪一組
      const activeMemberEvents = memberEventTab === 'history'
        ? historyMemberEvents.slice(0,memberHistoryLimit)
        : currentMemberEvents;
      const lobbyEvents = [...events].filter(evt => evt.status === 'open')
        .sort((a, b) => new Date(a.event_date).getTime() - new Date(b.event_date).getTime());

      // 團務分類
      const adminEventSections = [
        {
          key: 'upcoming',
          title: '即將進行',
          icon: '🕯️',
          description: '尚未開始的開放團務',
          items: sortEventsByDate(events.filter( evt => evt.status === 'open' && !isEventStarted(evt.event_date)))
        },
        {
          key: 'settlement',
          title: '等待結算',
          icon: '📜',
          description: '已到開團時間，等待 Keeper 完成結算',
          items: sortEventsByDate(events.filter( evt => evt.status === 'open' && isEventStarted(evt.event_date)),'desc')
        },
        {
          key: 'completed',
          title: '已完成',
          icon: '✓',
          description: '已完成團務結算',
          items: sortEventsByDate(events.filter( evt => evt.status === 'completed'),'desc')
        },
        {
          key: 'cancelled',
          title: '已取消',
          icon: '🚫',
          description: '已取消但仍保留歷史資料',
          items: sortEventsByDate(events.filter( evt => evt.status === 'cancelled'),'desc')
        }
      ];

      const activeAdminEventSection = adminEventSections.find(section => section.key === adminEventTab) || adminEventSections[0];

      const getLobbyEventStatusMeta = (evt,booked) => {
        const started = isEventStarted(evt.event_date);
        const locked = checkIsLocked(evt.event_date,evt.lock_hours);
        const isFull = booked >= Number(evt.max_players || 0);
        if (started) {
          return {
            label: '等待結算',
            className: 'bg-amber-950 text-amber-300 border-amber-800'
          };
        }
        if (locked) {
          return {
            label: '名單已鎖定',
            className: 'bg-red-950/80 text-red-300 border-red-800'
          };
        }
        if (isFull) {
          return {
            label: '已額滿',
            className: 'bg-stone-900 text-stone-400 border-stone-700'
          };
        }
        return {
          label: '招募中',
          className: 'bg-emerald-950 text-emerald-300 border-emerald-800'
        };
      };
      const getAdminEventStatusMeta = (evt) => {
        if (evt.status === 'cancelled') {
          return {
            label: '已取消',
            className: 'bg-red-950 text-red-300 border-red-800'
          };
        }
        if (evt.status === 'completed') {
          return {
            label: '已完成',
            className: 'bg-emerald-950 text-emerald-300 border-emerald-800'
          };
        }
        if (isEventStarted(evt.event_date)
        ) {
          return {
            label: '等待結算',
            className: 'bg-amber-950 text-amber-300 border-amber-800'
          };
        }
        if (checkIsLocked(evt.event_date,evt.lock_hours)
        ) {
          return {
            label: '名單已鎖定',
            className: 'bg-purple-950 text-purple-300 border-purple-800'
          };
        }
        return {
          label: '招募中',
          className: 'bg-copper/10 text-copper border-copper/40'
        };
      };

      const handleOpenNewGallery = () => {
        if (accountRole !== 'admin') {
          return;
        }
        setEditingGalleryItem(null);
        setGalleryCaption('');
        setGalleryFile(null);
        setShowGalleryForm(true);
      };
      const handleOpenEditGallery = (item) => {
        if (accountRole !== 'admin') {
          return;
        }
        setEditingGalleryItem(item);
        setGalleryCaption(item.caption || '');
        setGalleryFile(null);
        setShowGalleryForm(true);
      };
      const handleCloseGalleryForm = () => {
        if (gallerySaving) {
          return;
        }
        setShowGalleryForm(false);
        setEditingGalleryItem(null);
        setGalleryCaption('');
        setGalleryFile(null);
      };
      const handleSaveGallery = async (e) => {
        e.preventDefault();

        if (!currentUser || accountRole !== 'admin') {
          return showToast('只有 Keeper 可以管理花絮。','error');
        }

        const caption = galleryCaption.trim();
        if (!caption) {
          return showToast('請輸入圖片摘要。','error');
        }

        // 新增時一定要選圖片
        if (!editingGalleryItem && !galleryFile) {
          return showToast('請選擇要上傳的圖片。','error');
        }

        const allowedTypes = [
          'image/jpeg',
          'image/png',
          'image/webp',
          'image/avif'
        ];

        if (galleryFile) {
          if (!allowedTypes.includes(galleryFile.type)) {
            return showToast('圖片僅支援 JPG、PNG、WebP、AVIF。', 'error');
          }
          if (galleryFile.size > 5 * 1024 * 1024) {
            return showToast('單張圖片不可超過 5MB。','error');
          }
        }

        setGallerySaving(true);

        let newImagePath = null;
        try {
          // 如果有新圖片，先上傳
          if (galleryFile) {
            const extensionMap = {
              'image/jpeg': 'jpg',
              'image/png': 'png',
              'image/webp': 'webp',
              'image/avif': 'avif'
            };

            const extension = extensionMap[galleryFile.type] || 'jpg';

            newImagePath = `gallery/${crypto.randomUUID()}.${extension}`;

            const {error: uploadError} =
              await supabaseClient.storage.from('trpg-gallery')
                .upload(newImagePath,galleryFile,{cacheControl: '3600',upsert: false}
                );

            if (uploadError) {throw uploadError;}
          }

          // 編輯
          if (editingGalleryItem) {
            const payload = {caption,updated_at: new Date().toISOString()};
            if (newImagePath) {payload.image_path = newImagePath;}

            const {error: updateError} =
              await supabaseClient.from('gallery_items').update(payload).eq('id',editingGalleryItem.id);
            if (updateError) {
              if (newImagePath) {
                await supabaseClient.storage.from('trpg-gallery').remove([newImagePath]);
              }
              throw updateError;
            }

            if (newImagePath && editingGalleryItem.imagePath) {
              const {error: removeOldError} =
                await supabaseClient.storage.from('trpg-gallery').remove([editingGalleryItem.imagePath]);
              if (removeOldError) {console.warn('舊圖片清除失敗:',removeOldError);
              }
            }
            showToast('花絮已更新。','success');
          }

          // 新增

            const {error: insertError} =
              await supabaseClient.from('gallery_items').insert({
                  image_path: newImagePath,
                  caption
                });

            if (insertError) {
              // DB 新增失敗 刪除 Storage 圖片
              if (newImagePath) {
                await supabaseClient.storage.from('trpg-gallery').remove([newImagePath]);
              }
              throw insertError;
            }
            showToast('花絮圖片已發布。','success');

          setEditingGalleryItem(null);
          setGalleryCaption('');
          setGalleryFile(null);
          await fetchGallery();

                        return (
                          <div key={ result.character_id || `${result.user_id}-${index}`} className="bg-void border border-borderDefault rounded-2xl p-4">
                            <div className="flex flex-col sm:flex-row justify-between gap-4">
                              <div>
                                <div className="font-bold text-parchment">
                                  {result.display_name || '未設定暱稱'}
                                </div>
                                <div className="text-xs text-mutedText mt-1">
                                  {result.email}
                                </div>

                                {(result.line_id || result.phone) && (
                                  <div className="text-[11px] text-mutedText mt-1">
                                    {result.line_id && `LINE：${result.line_id}`}
                                    {result.line_id && result.phone && ' ｜ '}
                                    {result.phone && `手機：${result.phone}`}
                                  </div>
                                )}

                                {result.character_id ? (
                                  <div className="mt-3 bg-cardBg border border-borderHighlight rounded-xl p-3">
                                    <div className="text-sm font-bold text-copper">
                                      {result.character_name}
                                    </div>
                                    <div className="text-xs text-mutedText mt-1">
                                      {result.occupation}
                                      {' • '}
                                      SAN {result.san}
                                    </div>
                                  </div>
                                ) : (
                                  <div className="mt-3 text-xs text-red-300">
                                    此會員尚未建立角色卡
                                  </div>
                                )}
                              </div>

                              <div className="flex items-center">
                                <button type="button"
                                  disabled={!result.character_id || alreadyJoined || isActionLoading(`add:${result.character_id}`)}
                                  onClick={() => handleAdminAddParticipant(result.character_id)}
                                  className={`px-4 py-2 rounded-xl text-xs font-bold ${
                                    !result.character_id ||
                                    alreadyJoined
                                      ? 'bg-stone-900 text-stone-600 cursor-not-allowed'
                                      : 'bg-emerald-900 hover:bg-emerald-800 text-emerald-100'
                                  }`}
                                >
                                  {isActionLoading(`add:${result.character_id}`)
                                    ? '加入中...'
                                    : alreadyJoined
                                      ? '已在隊伍中'
                                      : !result.character_id
                                        ? '無角色'
                                        : '加入團務'
                                  }
                                </button>
                              </div>
                            </div>
                          </div>
                        );
                      }
                    )
                  )}
                </div>

                <div className="mt-5 bg-copper/5 border border-copper/20 rounded-xl p-4 text-xs text-mutedText leading-relaxed">
                  Keeper 手動加入不受 36 小時鎖定限制。
                  被加入的角色會正式寫入團務名冊，
                  因此之後團務結算時也能正常收到角色成長紀錄。
                </div>
              </div>
            </div>
          )}

          {/* ==========================================
              彈窗：跑團成長 (Member 專用)
            ========================================== */}
          {growthRecordCharacter && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-cardBg border border-purple-700/50 rounded-3xl max-w-2xl w-full p-6 sm:p-8 shadow-2xl max-h-[85vh] overflow-y-auto custom-scrollbar">
                <div className="flex justify-between items-start pb-4 border-b border-borderDefault">
                  <div>
                    <div className="text-xs text-copper">
                      調查員成長檔案
                    </div>
                    <h3 className="text-2xl font-bold text-parchment mt-1">
                      {growthRecordCharacter.name}
                    </h3>
                    <p className="text-xs text-mutedText mt-1">
                      {getCharacterTitle( growthRecordCharacter.san)}
                    </p>
                  </div>

                  <button onClick={() => setGrowthRecordCharacter(null)} className="w-8 h-8 rounded-full bg-void text-mutedText hover:text-white">✕</button>
                </div>

                <div className="mt-5 space-y-4">
                  {growthRecords.filter( record => record.character_id === growthRecordCharacter.id).length === 0 ? (
                    <div className="p-6 text-center bg-void rounded-2xl border border-borderDefault text-sm text-mutedText">
                      這名調查員目前尚無成長紀錄。
                    </div>
                  ) : ( growthRecords.filter( record => record.character_id === growthRecordCharacter.id)
                      .map(record => {
                        const recordEvent = events.find(evt => evt.id === record.event_id);
                        return (
                          <div key={record.id} className="bg-void rounded-2xl border border-borderDefault p-5 space-y-3">
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                              <div>
                                <div className="text-sm font-bold text-parchment">
                                  {recordEvent?.title || '未知團務'}
                                </div>
                                <div className="text-xs text-copper mt-0.5">
                                  {recordEvent?.scenario_name}
                                </div>
                              </div>
                              <div className="text-xs text-mutedText">
                                {new Date( record.created_at).toLocaleDateString('zh-TW')}
                              </div>
                            </div>

                            <div className="border-t border-borderDefault pt-3">
                              <div className="text-xs text-mutedText mb-2">
                                Keeper 成長紀錄
                              </div>
                              <div className="text-sm text-parchment leading-relaxed whitespace-pre-wrap bg-cardBg p-4 rounded-xl border border-borderHighlight/50">
                                {record.growth_note}
                              </div>
                            </div>
                          </div>
                        )
                      })
                  )}
                </div>

                <div className="mt-6 p-4 rounded-2xl bg-copper/5 border border-copper/20 text-xs text-mutedText leading-relaxed">
                  💡 完成閱讀後，請依照 Keeper 提供的成長紀錄，
                  自行更新角色卡中的 SAN、屬性、狀態、裝備或其他資料。
                </div>
              </div>
            </div>
          )}

          {/* ==========================================
              彈窗：編輯會員資料
            ========================================== */}
          {showProfileEdit && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-cardBg border border-copper/40 rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl">
                <div className="flex justify-between items-start mb-5">
                  <div>
                    <div className="text-xs text-copper">
                      INVESTIGATOR PROFILE
                    </div>
                    <h3 className="text-xl font-bold text-parchment">
                      編輯會員資料
                    </h3>
                  </div>
                  <button type="button" onClick={() => setShowProfileEdit(false)} className="w-8 h-8 bg-void rounded-full text-mutedText hover:text-white">✕</button>
                </div>

                <form onSubmit={handleUpdateProfile} className="space-y-4">
                  <div>
                    <label className="block text-xs text-mutedText mb-1">
                      調查員暱稱 *
                    </label>
                    <input required type="text" value={profileForm.display_name}
                      onChange={e => setProfileForm({...profileForm, display_name: e.target.value})}
                      className="w-full bg-void border border-borderHighlight rounded-xl p-2.5 text-parchment"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-mutedText mb-1">
                      Email
                    </label>
                    <input disabled value={ profile?.email || currentUser?.email || ''} className="w-full bg-stone-950 border border-stone-800 rounded-xl p-2.5 text-stone-500 cursor-not-allowed"/>
                    <p className="text-[11px] text-mutedText mt-1">
                      Email 為登入帳號，目前不在此處修改。
                    </p>
                  </div>

                  <div>
                    <label className="block text-xs text-mutedText mb-1">
                      LINE ID
                    </label>
                    <input type="text" value={profileForm.line_id}
                      onChange={e => setProfileForm({...profileForm, line_id: e.target.value})}
                      className="w-full bg-void border border-borderHighlight rounded-xl p-2.5 text-parchment"
                    />
                  </div>

                  <div>
                    <label className="block text-xs text-mutedText mb-1">
                      手機
                    </label>
                    <input type="tel" value={profileForm.phone}
                      onChange={e => setProfileForm({...profileForm, phone: e.target.value})}
                      className="w-full bg-void border border-borderHighlight rounded-xl p-2.5 text-parchment"
                    />
                  </div>

                  <div className="bg-copper/5 border border-copper/20 rounded-xl p-3 text-xs text-mutedText leading-relaxed">
                    Email 會作為基本會員識別；LINE 與手機皆為選填，
                    主要提供 Keeper 在團務需要時聯絡使用。
                  </div>

                  <div className="flex justify-end gap-3 pt-3 border-t border-borderDefault">
                    <button type="button" onClick={() => setShowProfileEdit(false)} className="px-4 py-2 text-sm text-mutedText hover:text-white">
                      取消
                    </button>
                    <button type="submit"
                      disabled={isActionLoading('profile')}
                      className={`px-5 py-2 rounded-xl text-sm font-bold ${
                        isActionLoading('profile')
                          ? 'bg-stone-800 text-stone-500 cursor-wait'
                          : 'bg-copper hover:bg-copperDark text-black'
                      }`}
                    >
                      {isActionLoading('profile')
                        ? '儲存中...'
                        : '儲存會員資料'
                      }
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ==========================================
              彈窗：編輯角色成長 (Member 專用)
            ========================================== */}
          {editingCharacter && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-cardBg border border-copper/40 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl">
                <div className="flex justify-between items-start mb-5">
                  <div>
                    <div className="text-xs text-copper">
                      調查員檔案管理
                    </div>
                    <h3 className="text-xl font-bold text-parchment">
                      編輯角色卡
                    </h3>
                  </div>
                  <button type="button" onClick={() => setEditingCharacter(null)} className="w-8 h-8 bg-void rounded-full text-mutedText hover:text-white">✕</button>
                </div>

                <form onSubmit={handleUpdateCharacter} className="space-y-4">
                  <div>
                    <label className="block text-xs text-mutedText mb-1">姓名</label>
                    <input required value={editCharacterData.name} onChange={e => setEditCharacterData({...editCharacterData, name: e.target.value})} className="w-full bg-void border border-borderHighlight rounded-xl p-2.5 text-parchment"/>
                  </div>
                  <div>
                    <label className="block text-xs text-mutedText mb-1">職業</label>
                    <input required value={editCharacterData.occupation} onChange={e => setEditCharacterData({...editCharacterData, occupation: e.target.value})}  className="w-full bg-void border border-borderHighlight rounded-xl p-2.5 text-parchment"/>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-mutedText mb-1">目前 SAN</label>
                      <input required type="number" min="0" max="99" value={editCharacterData.san} onChange={e => setEditCharacterData({...editCharacterData, san: e.target.value})} className="w-full bg-void border border-borderHighlight rounded-xl p-2.5 text-parchment"/>
                    </div>

                    <div>
                      <label className="block text-xs text-mutedText mb-1">最大 SAN</label>
                      <input required type="number" min="1" max="99" value={editCharacterData.max_san} onChange={e => setEditCharacterData({...editCharacterData, max_san: e.target.value})} className="w-full bg-void border border-borderHighlight rounded-xl p-2.5 text-parchment"/>
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs text-mutedText mb-1">背景／特殊信物</label>
                    <textarea rows="4" value={editCharacterData.feature} onChange={e => setEditCharacterData({...editCharacterData,feature: e.target.value})} className="w-full bg-void border border-borderHighlight rounded-xl p-2.5 text-parchment resize-none"/>
                  </div>
                  <div className="bg-void/60 border border-borderDefault rounded-xl p-3">
                    <div className="text-xs text-mutedText">目前稱號</div>
                    <div className="text-sm text-copper font-bold mt-1">{getCharacterTitle( editCharacterData.san)}</div>
                  </div>
                  <div className="flex justify-end gap-3 pt-3 border-t border-borderDefault">
                    <button type="button" onClick={() => setEditingCharacter(null)} className="px-4 py-2 text-sm text-mutedText hover:text-white">取消</button>
                    <button type="submit"
                      disabled={isActionLoading(`update-char:${editingCharacter.id}`)}
                      className={`px-5 py-2 rounded-xl text-sm font-bold ${
                        isActionLoading(`update-char:${editingCharacter.id}`)
                          ? 'bg-stone-800 text-stone-500 cursor-wait'
                          : 'bg-copper hover:bg-copperDark text-black'
                      }`}
                    >
                      {isActionLoading(`update-char:${editingCharacter.id}`)
                        ? '儲存中...'
                        : '儲存角色卡'
                      }
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ==========================================
              彈窗：上傳圖片 (Keeper 專用)
            ========================================== */}
          {showGalleryForm && (
            <div className="fixed inset-0 z-[80] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="bg-cardBg border border-copper/40 rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl">
                <div className="flex justify-between items-start mb-5">
                  <div>
                    <div className="text-xs text-copper">
                      GALLERY ARCHIVE
                    </div>
                    <h3 className="text-xl font-bold text-parchment">
                      {editingGalleryItem
                        ? '編輯花絮'
                        : '新增花絮'}
                    </h3>
                  </div>
                  <button type="button" disabled={gallerySaving} onClick={handleCloseGalleryForm} className="w-8 h-8 bg-void rounded-full text-mutedText hover:text-white">
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveGallery} className="space-y-5">
                  {editingGalleryItem && (
                    <div className="aspect-[4/3] overflow-hidden rounded-2xl bg-void border border-borderDefault">
                      <img src={editingGalleryItem.imageUrl} alt="" className="w-full h-full object-cover"/>
                    </div>
                  )}
                  <div>
                    <label className="block text-xs text-mutedText mb-2">
                      {editingGalleryItem
                        ? '替換圖片（選填）'
                        : '花絮圖片 *'}
                    </label>
                    <input type="file" accept="image/jpeg,image/png,image/webp,image/avif" disabled={gallerySaving}
                      onChange={e => setGalleryFile(e.target.files?.[0] || null)}
                      className="w-full bg-void border border-borderHighlight rounded-xl p-2.5 text-sm text-mutedText"/>
                    <p className="text-[11px] text-mutedText mt-1">
                      JPG、PNG、WebP、AVIF，最大 5MB。網站縮圖統一顯示為 4:3。
                    </p>
                  </div>
                  <div>
                    <label className="block text-xs text-mutedText mb-2">
                      圖片摘要 *
                    </label>
                    <textarea required maxLength="500" rows="4" disabled={gallerySaving} value={galleryCaption}
                      onChange={e => setGalleryCaption(e.target.value)}
                      placeholder="簡短記錄這張照片的內容..."
                      className="w-full bg-void border border-borderHighlight rounded-xl p-3 text-sm text-parchment resize-y"/>
                    <div className="text-right text-[11px] text-mutedText mt-1">
                      {galleryCaption.length}
                      {' / '}
                      500
                    </div>
                  </div>

                  <div className="flex justify-end gap-3 pt-4 border-t border-borderDefault">
                    <button type="button" disabled={gallerySaving} onClick={handleCloseGalleryForm} className="px-4 py-2 text-sm text-mutedText hover:text-white">
                      取消
                    </button>
                    <button type="submit"
                      disabled={gallerySaving}
                      className="px-5 py-2.5 bg-copper hover:bg-copperDark disabled:bg-stone-800 disabled:text-stone-500 text-black rounded-xl text-sm font-bold">
                      {gallerySaving
                        ? '儲存中...'
                        : editingGalleryItem
                          ? '儲存修改'
                          : '發布花絮'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ==========================================
              彈窗：Lightbox
            ========================================== */}
          {galleryLightboxIndex !== null && galleryItems[galleryLightboxIndex] && (
            <div onClick={closeGalleryLightbox} className="fixed inset-0 z-[100] bg-black/95 backdrop-blur-md flex items-center justify-center p-4">
              <button onClick={closeGalleryLightbox} className="absolute top-5 right-5 z-20 w-10 h-10 rounded-full bg-black/60 border border-white/20 text-white hover:bg-black">
                ✕
              </button>

              {
                galleryItems.length > 1 && (
                <button onClick={e => {e.stopPropagation(); showPreviousGallery();}} className="absolute left-3 sm:left-8 z-20 w-11 h-11 rounded-full bg-black/60 border border-white/20 text-white text-xl hover:bg-black">
                  ←
                </button>
              )}

              <div onClick={e => e.stopPropagation()} className="max-w-5xl w-full max-h-[90vh] flex flex-col items-center justify-center">
                <img
                  src={galleryItems[galleryLightboxIndex].imageUrl}
                  alt={galleryItems[galleryLightboxIndex].caption}
                  className="max-w-full max-h-[75vh] object-contain rounded-xl shadow-2xl"/>
                <div className="mt-4 max-w-2xl text-center">
                  <p className="text-sm sm:text-base text-parchment leading-relaxed">
                    {galleryItems[galleryLightboxIndex].caption}
                  </p>

                  <div className="text-xs text-mutedText mt-2">
                    {galleryLightboxIndex + 1}
                    {' / '}
                    {galleryItems.length}
                  </div>

                </div>
              </div>

              {galleryItems.length > 1 && (
                <button onClick={e => {e.stopPropagation(); showNextGallery();}} className="absolute right-3 sm:right-8 z-20 w-11 h-11 rounded-full bg-black/60 border border-white/20 text-white text-xl hover:bg-black">
                  →
                </button>
              )}
            </div>
          )}

          <footer className="border-t border-borderHighlight/30 bg-void/90 py-6 text-center text-xs text-mutedText">
            <div className="max-w-6xl mx-auto px-5 flex flex-col sm:flex-row items-center justify-between gap-3">
              <span className="font-gothic tracking-wider text-parchment">
                MISKATONIC ARCHIVES • CALL OF CTHULHU 7TH ED.
              </span>
              <span>
                沉浸式 TRPG 預約管理系統
              </span>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
