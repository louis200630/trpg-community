              .from('events')
              .select(`
                *,
                bookings (
                  user_id,
                  profiles ( display_name, phone, line_id ),
                  characters ( name, occupation, san )

            setIsLoading(false);

            user_id: user.id,
            character_id: char.id,
            status: 'confirmed'

          alert('報名未完成：' + error.message);
          return;

        window.location.reload();
