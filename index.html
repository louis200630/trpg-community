  <script type="text/babel">

    // 2. 備用展示資料 (Mock Data) - 當資料庫為空時顯示
    const MOCK_EVENTS = [
      {
        id: 'evt-101', title: '密斯卡託尼克古籍失竊案', scenario_name: '狂氣之山的前奏',

        location: '新北市板橋地窖俱樂部 (實體面團)', event_date: '2026-09-18T14:00:00',

        booked_investigators: [
          { userId: 'u-02', charName: '湯瑪斯·卡特', occupation: '戰地軍醫', san: 72 }
        ]
      }
    ];
    const MOCK_CHARS = [{ id: 'char-1', name: '奧古斯特', occupation: '教授', san: 65, max_san: 99, feature: '狂熱於古符號', is_active: true }];

    const INITIAL_RECAPS = [
      {
        id: 'rec-1',
        title: '沉落的印斯茅斯燈塔之役',
        date: '2026-08-28',
        tag: '經典逃脫',
        summary: '軍醫精準投擲燃燒瓶封鎖旋轉階梯，調查員全員成功搭乘救生艇衝破潮汐逃脫。',
        survivors: ['湯瑪斯 (軍醫)', '奧古斯特 (教授)'],
        exp: 120,
        image: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80'
      },
      {
        id: 'rec-2',
        title: '阿卡姆古林地的深淵低語',
        date: '2026-08-14',
        tag: '狂亂震撼',
        summary: '四人誤闖古林石陣，在黎明破曉前夕驅車衝出封鎖，但一人意識陷入永久創傷。',
        survivors: ['艾琳 (偵探)', '諾曼 (記者)'],
        exp: 100,
        image: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=800&q=80'
      }
    ];

    const INITIAL_MY_CHARACTERS = [
      {
        id: 'char-1',
        name: '奧古斯特·德雷斯',
        occupation: '密大古典學教授',
        san: 65,
        max_san: 99,
        feature: '隨身攜帶古代羊皮卷殘本，對古符號極具狂熱',
        is_active: true
      },
      {
        id: 'char-2',
        name: '「渡鴉」伊蓮娜',
        occupation: '黑市古董掮客',
        san: 35,
        max_san: 85,
        feature: '聽覺敏銳，常在夜雨下水道聽見細微抓撓聲',
        is_active: false
      }
    ];

    // 3. 主應用程式 Component
    function App() {
      // --- 狀態管理 ---
      const [currentTab, setCurrentTab] = useState('lobby');
      const [currentUser, setCurrentUser] = useState(null);
      const [profile, setProfile] = useState(null);
      const [accountRole, setAccountRole] = useState('member');
      const [userExp, setUserExp] = useState(0);
      const [portalView, setPortalView] = useState('member');

      // 資料集
      const [events, setEvents] = useState([]);
      const [characters, setCharacters] = useState([]);
      const [recaps, setRecaps] = useState([]);
      const [isUsingMock, setIsUsingMock] = useState(false);

      // 互動視窗狀態
      const [activeEvent, setActiveEvent] = useState(null);
      const [selectedCharId, setSelectedCharId] = useState('');
      const [lockAlertMessage, setLockAlertMessage] = useState(null);

      // 表單狀態
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authMode, setAuthMode] = useState('login'); // login | signup
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authName, setAuthName] = useState('');
      
      const [showNewEventModal, setShowNewEventModal] = useState(false);
      const [newEventData, setNewEventData] = useState({ title: '', scenario_name: '', location: '', event_date: '', one_liner: '', min: 1, max: 4});

      const [showNewCharForm, setShowNewCharForm] = useState(false);
      const [newChar, setNewChar] = useState({ name: '', occupation: '', san: 60, feature: '' });

      // 自訂通知 Toast（取代原生 alert）
      const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });
      const showToast = (msg, type = 'info') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 3000);
      };

      useEffect(() => {
        if (!supabaseClient) {
          console.error('❌ supabaseClient 不存在');
          return;
        }

        console.log('🔎 Supabase Client:', supabaseClient);
        console.log('🔎 Supabase Auth:', supabaseClient.auth);

        if (!supabaseClient.auth) {
          console.error('❌ supabaseClient.auth 不存在');
          return;
        }

        // 取得目前登入狀態
        supabaseClient.auth
          .getSession()
          .then(({ data, error }) => {
            console.log('🔎 getSession:', data, error);

            if (error) {
              console.error('getSession error:', error);
              return;
            }

            setCurrentUser(data?.session?.user ?? null);
          });

        // 監聽登入 / 登出
        const {
          data: authListener
        } = supabaseClient.auth.onAuthStateChange(
          (event, session) => {
            console.log('🔐 Auth 狀態改變:', event, session);

            setCurrentUser(session?.user ?? null);
          }
        );

        return () => {
          authListener?.subscription?.unsubscribe();
        };

      }, []);

      const fetchProfile = async (user) => {
        if (!supabaseClient || !user) {
          setProfile(null);
          setAccountRole('member');
          setUserExp(0);
          setPortalView('member');
          return;
        }

        try {
          const { data, error } = await supabaseClient
            .from('profiles')
            .select(`
              id,
              email,
              display_name,
              phone,
              line_id,
              exp,
              title,
              role
            `)
            .eq('id', user.id)
            .single();

          console.log('👤 Profile 查詢結果:', data);
          console.log('👤 Profile 查詢錯誤:', error);

          if (error) {
            throw error;
          }

          setProfile(data);

          setAccountRole(
            data?.role === 'admin'
              ? 'admin'
              : 'member'
          );

          setUserExp(
            Number(data?.exp) || 0
          );

        } catch (error) {

          console.error( '❌ Profile 讀取失敗:',error);

          setProfile(null);
          setAccountRole('member');
          setUserExp(0);
          setPortalView('member');
        }
      };

      useEffect(() => {

        if (currentUser) {

          console.log('👤 已登入，讀取會員資料:', currentUser.id);

          fetchProfile(currentUser);
          fetchAllData();

        } else {

          console.log('👤 未登入');

          setProfile(null);
          setAccountRole('member');
          setUserExp(0);
          setPortalView('member');

          // 登出後一定要清空上一個人的角色卡
          setCharacters([]);
          setSelectedCharId('');

          // 公開場次仍然可以讀
          fetchAllData();
        }

      }, [currentUser]);

      const fetchAllData = async () => {
        if (!supabaseClient) return useMockData();
        try {
          // 抓場次
          const { data: evts, error: eErr } = await supabaseClient
          .from('events')
          .select(`
            *,
            bookings(
              user_id,
              characters(
                name,
                occupation,
                san
              )
            )
          `);

        if (eErr) { throw eErr;}
        console.log('events 查詢成功:', evts);
          
          const formattedEvts = evts.map(evt => ({
            ...evt,
            booked_investigators: (evt.bookings || []).map(b => ({
              userId: b.user_id, charName: b.characters?.name || '無名', occupation: b.characters?.occupation, san: b.characters?.san
            }))
          }));
          setEvents(formattedEvts);

          // 若有登入，抓角色卡
          if (currentUser) {
            const { data: chars } = await supabaseClient.from('characters').select('*').eq('user_id', currentUser.id);
            if (chars && chars.length > 0) {
              setCharacters(chars);
              setSelectedCharId(chars[0].id);
            }
          }
          setIsUsingMock(false);
        } catch (err) {
          console.warn("使用本地展示資料:", err.message);
          useMockData();
        }
      };

      const useMockData = () => {
        setEvents(MOCK_EVENTS);
        setCharacters(MOCK_CHARS);
        setSelectedCharId(MOCK_CHARS[0].id);
        setIsUsingMock(true);
      };

      // 稱號等級計算
      const levelTitle = useMemo(() => {
        if (userExp >= 600) return '【傳奇】舊印持有者';
        if (userExp >= 300) return '【老練】阿卡姆秘社常客';
        return '【見習】初涉異變的調查員';
      }, [userExp]);

      // 輔助判斷
      const isBooked = (evt) => {
        if (!evt || !evt.booked_investigators) return false;
        const myId = currentUser?.id || 'mock-user';
        return evt.booked_investigators.some(i => i.userId === myId);
      };

      // 檢查是否處於 36 小時鎖定退團視窗內
      const checkIsLocked = (eventDateStr, lockHours = 36) => {
        const eventTime = new Date(eventDateStr).getTime();
        const now = Date.now();
        const diffMs = eventTime - now;
        return (
          diffMs > 0 &&
          diffMs <= Number(lockHours || 36) * 60 * 60 * 1000
        );
      };

      /* 1. 登入與註冊 */
      const handleAuthSubmit = async (e) => {
        e.preventDefault();
        console.log('=== 表單 submit 有觸發 ===');
        console.log('authMode:', authMode);
        console.log('email:', authEmail);
        console.log('name:', authName);

        if (!supabaseClient) {
          console.error('Supabase Client 不存在');
          return showToast('Supabase 尚未初始化', 'error');
        }
        try {
          if (authMode === 'signup') {
            console.log('準備呼叫 signUp');
            const { data, error } =
              await supabaseClient.auth.signUp({
                email: authEmail.trim(),
                password: authPassword,
                options: {
                  data: {
                    full_name: authName.trim()
                  }
                }
              });
            console.log('SIGNUP DATA:', data);
            console.log('SIGNUP ERROR:', error);

            if (error) {
              console.error('註冊失敗:', error);
              showToast( '註冊失敗：' + error.message, 'error');
              return;
            }

            showToast(data.session ? '註冊成功，已登入！' : '註冊成功！請查看信箱完成驗證。', 'success');

            setAuthEmail('');
            setAuthPassword('');
            setAuthName('');
            setShowAuthModal(false);

          } else {
            const { data, error } =
              await supabaseClient.auth.signInWithPassword({
                email: authEmail.trim(),
                password: authPassword
              });
            console.log('LOGIN DATA:', data);
            console.log('LOGIN ERROR:', error);

            if (error) {
              showToast( '登入失敗：' + error.message,'error');
              return;
            }

            showToast('歡迎歸來，調查員。','success');
            setAuthEmail('');
            setAuthPassword('');
            setShowAuthModal(false);
          }
        } catch (err) {
          console.error('Auth 未預期錯誤:', err);
          showToast('系統錯誤：' + err.message,'error');
        }
      };

      const handleLogout = async () => {
        if (supabaseClient) await supabaseClient.auth.signOut();
        showToast('已安全登出。', 'info');
      };

      /* 4. 報名與退團 */
      const handleJoinEvent = async (eventId) => {

        if (!currentUser) {
          setShowAuthModal(true);
          return showToast( '請先登入調查員系統。', 'error');
        }
        if (!selectedCharId) {
          return showToast( '請先建立並選擇一張角色卡。', 'error');
        }

        const evt = events.find( event => event.id === eventId);
        if (!evt) {return showToast('找不到這個場次。','error');}
        if (evt.status !== 'open') {return showToast('這個場次目前無法報名。','error');}

        const booked = evt.booked_investigators?.length || 0;
        if (booked >= evt.max_players) { return showToast('很可惜，本場目前已額滿。','error');}

        try {
          const { data, error} = await supabaseClient.rpc('join_event', { p_event_id: eventId, p_character_id: selectedCharId});
          console.log('🎟 join_event result:', data);
          console.log('🎟 join_event error:', error);

          if (error) {
            console.error('報名失敗:',error);
            return showToast( error.message,'error');
          }
          await fetchAllData();
          // 避免 modal 保留舊的 event state
          setActiveEvent(null);
          showToast('契約立定，報名成功！','success');
        } catch (err) {
          console.error('報名發生錯誤:',err);
          showToast('系統錯誤：' + err.message,'error');
        }
      };


      const handleLeaveEvent = async (evt) => {

        if (!currentUser) { return showToast('請先登入。','error');}
        if (!evt?.id) { return showToast('場次資料錯誤。','error');}

        // 前端檢查 36 小時規則
        if (
          checkIsLocked( evt.event_date, evt.lock_hours)
        ) {
          setLockAlertMessage( `本場已進入開團前 ${ evt.lock_hours || 36 } 小時鎖定期，如需退出請聯絡 Keeper。`);
          return;
        }

        try {
          const { data, error} = await supabaseClient.rpc('leave_event',{ p_event_id: evt.id});
          console.log('🚪 leave_event result:', data);
          console.log('🚪 leave_event error:', error);

          if (error) {
            console.error('退團失敗:', error);
            setLockAlertMessage(error.message);
            return;
          }
          await fetchAllData();

          setActiveEvent(null);
          showToast('已自名冊註銷。','info');

        } catch (err) {
          console.error('退團發生錯誤:',err);
          showToast('系統錯誤：' + err.message,'error');
        }
      };

      /* 2. 新增角色卡 */
      const handleCreateChar = async (e) => {
        e.preventDefault();
        if (!newChar.name || !newChar.occupation) return;
        
        const payload = {
          name: newChar.name,
          occupation: newChar.occupation,
          san: Number(newChar.san) || 50,
          max_san: 99,
          feature: newChar.feature || '無',
          is_active: true
        };

        if (!isUsingMock && supabaseClient && currentUser) {
          payload.user_id = currentUser.id;

          const { error } = await supabaseClient
            .from('characters')
            .insert(payload);

          if (error) {
            console.error('建立角色失敗:', error);
            return showToast('新增失敗：' + error.message, 'error');
          }

          await fetchAllData();
        } else {
          setCharacters(prev => [...prev, payload]);
        }
        showToast(`角色卡 [${newChar.name}] 建立成功！`, 'success');
        setShowNewCharForm(false);
      };

      /* 3. 發布新團務 (Keeper) */
      const handleCreateEvent = async (e) => {
        e.preventDefault();

        // 前端第一層防護
        if (!currentUser) { return showToast( '請先登入 Keeper 帳號。', 'error'); }
        if (accountRole !== 'admin') { return showToast('權限不足：只有 Keeper 可以發布團務。', 'error');}

        if (!newEventData.title.trim()) { return showToast('請輸入場次標題。', 'error');}
        if (!newEventData.scenario_name.trim()) {return showToast('請輸入劇本名稱。', 'error');}
        if (!newEventData.event_date) {return showToast('請選擇開團時間。', 'error');}

        try {
          const minPlayers = Number(newEventData.min);
          const maxPlayers = Number(newEventData.max);
          if (
            !Number.isInteger(minPlayers) ||
            !Number.isInteger(maxPlayers) ||
            minPlayers < 1 || maxPlayers < 1
          ) {
            return showToast('最低與最高人數至少都要是 1 人。','error');
          }

          if (minPlayers > maxPlayers) {
            return showToast('最低人數不能高於最高人數。','error');
          }

          if (maxPlayers > 8) {
            return showToast('目前最高人數上限設定為 8 人。','error');
          }

          const payload = {
            title: newEventData.title.trim(),
            scenario_name: newEventData.scenario_name.trim(),
            location: newEventData.location.trim(),
            event_date: new Date(
              newEventData.event_date
            ).toISOString(),
            one_liner: newEventData.one_liner.trim(),

            min_players: minPlayers,
            max_players: maxPlayers,

            lock_hours: 36,
            status: 'open',

            keeper_name:
              profile?.display_name ||
              currentUser.user_metadata?.full_name ||
              'Keeper',

            keeper_contact:
              profile?.line_id ||
              profile?.phone ||

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={()=>setShowNewEventModal(false)} className="px-4 py-2 text-sm text-mutedText">取消</button>
                    <button type="submit" className="px-4 py-2 bg-crimson text-white font-bold text-sm rounded-lg">確認發布</button>
                  </div>
                </form>
              </div>
            </div>
          )}
          {/* ==========================================
              彈窗：編輯團務 (Keeper 專用)
            ========================================== */}
          {editingEvent && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="bg-cardBg w-full max-w-md rounded-3xl p-6 sm:p-8 border border-mystic/40 relative shadow-2xl">
                <div className="flex items-center justify-between mb-5">
                  <div>
                    <h3 className="text-xl font-bold text-copper">✏️ 編輯團務</h3>
                    <p className="text-xs text-mutedText mt-1">開團前 {editingEvent.lock_hours || 36} 小時將鎖定團務資料</p>
                  </div>
                  <button type="button" onClick={() => setEditingEvent(null)} className="w-8 h-8 rounded-full bg-void text-mutedText hover:text-white transition">✕</button>
                </div>
                <form onSubmit={handleUpdateEvent} className="space-y-4">
                  <div>
                    <label className="block text-xs text-mutedText mb-1">場次標題 *</label>
                    <input required type="text" value={editEventData.title} onChange={e => setEditEventData({...editEventData,title: e.target.value})} className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-copper"/>
                  </div>
                  <div>
                    <label className="block text-xs text-mutedText mb-1">劇本名稱 *</label>
                    <input required type="text" value={editEventData.scenario_name} onChange={e => setEditEventData({...editEventData,scenario_name: e.target.value})} className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-copper"/>
                  </div>
                  <div>
                    <label className="block text-xs text-mutedText mb-1">集合地點 *</label>
                    <input required type="text" value={editEventData.location} onChange={e => setEditEventData({...editEventData,location: e.target.value})} className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-copper"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-mutedText mb-1">開團日期與時間 *</label>
                    <input required type="datetime-local" value={editEventData.event_date} onChange={e => setEditEventData({...editEventData,event_date: e.target.value})} className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-copper"/>
                    <p className="text-[11px] text-mutedText mt-1">
                      修改後的新開團時間也必須距離現在超過 {editingEvent.lock_hours || 36} 小時。
                    </p>
                  </div>
                  <div>
                    <label className="block text-xs text-mutedText mb-1">一句話導讀 *</label>
                    <input required type="text" value={editEventData.one_liner} onChange={e => setEditEventData({...editEventData,one_liner: e.target.value})} className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-copper"/>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs text-mutedText mb-1">最低成團人數</label>
                      <input required type="number" min="1" max="8" value={editEventData.min} onChange={e => setEditEventData({...editEventData, min: e.target.value})} className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-copper"/>
                    </div>
                    <div>
                      <label className="block text-xs text-mutedText mb-1">最高人數</label>
                      <input required type="number" min="1" max="8" value={editEventData.max} onChange={e => setEditEventData({...editEventData, max: e.target.value})} className="w-full bg-void border border-purple-900 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-copper"/>
                    </div>
                  </div>
                  <div className="bg-void/60 border border-purple-950 rounded-xl p-3 text-xs text-mutedText">
                    目前已報名：
                    <strong className="text-copper ml-1">
                      {editingEvent.booked_investigators?.length || 0} 人
                    </strong>
                    <div className="mt-1">
                      最高人數不可設定低於目前已報名人數。
                    </div>
                  </div>
                  <div className="flex justify-end gap-3 pt-3 border-t border-purple-950">
                    <button type="button" onClick={() => setEditingEvent(null)} className="px-4 py-2 text-sm text-mutedText hover:text-white transition">取消</button>
                    <button type="submit" className="px-5 py-2 bg-copper hover:bg-copperDark text-black font-bold text-sm rounded-xl transition">儲存修改</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          <footer className="border-t border-purple-900/30 bg-void/90 py-6 text-center text-xs text-mutedText">
            <div className="max-w-6xl mx-auto px-5 flex flex-col sm:flex-row items-center justify-between gap-3">
              <span className="font-gothic tracking-wider text-parchment">
                MISKATONIC ARCHIVES • CALL OF CTHULHU 7TH ED.
              </span>
              <span>
                每週一團 • 沉浸式 TRPG 預約管理系統
              </span>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
